<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bible — Galatians 1:1–3</title><style>:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2933;--muted:#6b7280;--accent:#704214;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Noto Serif KR',serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:900px;margin:auto;padding:22px}.hero{padding:28px 0 16px}.hero h1{font-size:clamp(30px,6vw,54px);margin:0}.hero p{color:var(--muted);margin:.3rem 0}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,.filters button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.tabs button.active,.filters button.active{background:var(--ink);color:#fff}.verse{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.greek{font-size:1.24rem;line-height:1.9;font-weight:700}.pron{font:600 15px 'Trebuchet MS',Arial,sans-serif;color:#7a746c;line-height:1.25;margin-top:3px;letter-spacing:.01em}.wordline{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-start;margin-top:8px}.wordpair{display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap}.wordpair .gr{font-size:1.24rem;line-height:1.45;font-weight:700}.wordpair .pron{font-size:15px;text-align:center}.eng{font-style:italic;color:#374151;font-weight:700;font-size:1.04rem}.verb{color:#c62828}.noun{color:#228b22}.note{font-size:.92rem;color:var(--muted)}.q{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}.q button{width:100%;text-align:left;border:0;background:#fff;padding:16px;cursor:pointer;font:inherit}.q .meta{font:600 .78rem Arial,sans-serif;color:var(--accent);text-transform:uppercase}.q .ko{font-weight:700;margin-top:4px}.q .en{font-style:italic;color:#4b5563;margin-top:6px}.q .body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}.q.open .body{display:block}.answer{padding:14px 0 2px}.answer .label{font:700 .78rem Arial,sans-serif;color:var(--accent);text-transform:uppercase;margin-bottom:7px}.answer .ako{font-weight:600}.answer .aen{margin-top:8px;color:#4b5563;font-style:italic}.tap{font-size:.78rem;color:var(--muted);margin-top:7px}.footer{text-align:center;color:var(--muted);padding:30px 0;font-size:.85rem}.wordpair{border:0;background:none;padding:2px 3px;cursor:pointer;font:inherit;border-radius:7px;min-height:48px}.wordpair:hover,.wordpair:focus-visible{background:#f4ede2;outline:2px solid #a47b48}.wordpair .gr,.wordpair .pron{display:block}.wordpopup{position:fixed;z-index:30;width:min(350px,calc(100vw - 24px));max-height:min(420px,70vh);overflow:auto;padding:16px 18px;background:#fff;border:1px solid #bcb2a4;border-radius:14px;box-shadow:0 14px 40px #1f293355;line-height:1.5}.wordpopup[hidden]{display:none}.wordpopup .pophead{display:flex;justify-content:space-between;gap:12px}.wordpopup .popgreek{font-size:25px;font-weight:700}.wordpopup .poppron{font:700 17px Arial,sans-serif;color:#4b5563}.wordpopup .popmeaning{font-size:17px;font-weight:700;margin:12px 0 4px}.wordpopup .popko{font-size:16px}.wordpopup .popgrammar{border-top:1px solid #e5e0d7;margin-top:12px;padding-top:9px;font-size:14px}.wordpopup .popnote{font-size:14px;color:#4b5563;margin-top:7px}.wordpopup .popclose{width:32px;height:32px;border:0;border-radius:50%;background:#eee8de;font-size:20px;cursor:pointer;flex:none}@media(max-width:600px){.wordpopup{left:12px!important;right:12px;bottom:12px!important;top:auto!important;width:auto;max-height:55vh}}.ref-link{border:0;border-bottom:1px dashed #704214;padding:0 2px;background:#fff5df;color:#704214;font:inherit;cursor:pointer;border-radius:3px}.ref-link:hover,.ref-link:focus-visible{background:#ffe3a7;outline:2px solid #9c7133}.ref-backdrop[hidden]{display:none}.ref-backdrop{position:fixed;inset:0;z-index:40;background:#11182799;display:flex;align-items:center;justify-content:center;padding:14px}.ref-dialog{background:#fff;border-radius:16px;width:min(760px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;box-shadow:0 16px 45px #11182766}.ref-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #ded8cd;font-weight:700}.ref-title button{border:0;border-radius:50%;width:34px;height:34px;font-size:21px;background:#eee8de;cursor:pointer}.ref-scroll{overflow:auto;padding:16px 20px}.ref-verse{margin:0 0 14px;font-size:1.07rem;line-height:1.65}.ref-verse b{font:700 12px Arial,sans-serif;color:#704214;margin-right:8px}.ref-credit{font:13px Arial,sans-serif;color:#6b7280;padding:12px 20px;border-top:1px solid #ded8cd}</style></head><body><div class="wrap"><div class="hero"><div class="note">ANSWERS & COMMENTARY</div><h1>Question Bible</h1><p>Galatians 1:1–3 · 질문에서 본문으로, 본문에서 그리스도께로</p></div><div class="tabs" id="tabs"></div><div class="filters" id="filters"></div><div id="verse"></div><div id="questions"></div><div id="refBackdrop" class="ref-backdrop" hidden><div class="ref-dialog" role="dialog" aria-modal="true" aria-label="Our English Bible translation"><div class="ref-title"><span id="refHeading"></span><button type="button" id="refClose" aria-label="Close scripture">×</button></div><div id="refScroll" class="ref-scroll"></div><div class="ref-credit">Our English translation · UBS5 Greek base for Galatians · Scripture references in commentary</div></div></div><div id="wordpopup" class="wordpopup" role="dialog" aria-label="Greek word meaning" hidden></div><div class="footer">Tap a question to reveal its answer; tap again to hide it. · 먼저 생각한 뒤 필요할 때만 답을 펼쳐보세요. <a href="https://www.die-bibel.de/en/bible/UBS5/GAL.1" target="_blank" rel="noopener">UBS5 Greek source</a></div></div><script>
const data={
'1:1':{g:'Παῦλος ἀπόστολος, οὐκ ἀπ᾽ ἀνθρώπων οὐδὲ δι᾽ ἀνθρώπου, ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν',e:'Paul, an apostle—not from men nor through a man, but through Jesus Christ and God the Father, who raised Him from the dead—',qs:[['Observation','왜 바울은 자신의 이름 바로 뒤에 “사도”라고 했을까?','Why does Paul place “apostle” immediately after his name?','갈라디아서의 복음이 공격받는 상황에서 바울은 자신의 메시지의 권위가 개인적 의견이 아니라 그리스도께 받은 사도적 위임에 근거함을 처음부터 밝힙니다.','In a setting where his gospel was being challenged, Paul establishes from the outset that his message rests on an apostolic commission from Christ rather than on personal opinion.'],['Greek & Grammar','왜 바울은 ἀπό(from)와 διά(through)라는 서로 다른 전치사를 사용했을까?','Why does Paul use two different prepositions, ἀπό (“from”) and διά (“through”)?','ἀπό는 주로 근원(source)을, διά + 속격은 수단·매개(agency)를 나타냅니다. 바울은 자신의 사도직이 사람들에게서 기원하지도 않았고 한 사람을 매개로 전달된 것도 아니라고 부정합니다. [매우 확실]','ἀπό primarily marks source, while διά with the genitive commonly marks agency or mediation. Paul denies both a human source and a merely human intermediary for his apostleship. [Very high confidence]'],['Greek & Grammar','왜 ἀνθρώπων은 복수인데 ἀνθρώπου는 단수인가?','Why is ἀνθρώπων plural while ἀνθρώπου is singular?','복수는 사람들 또는 인간 집단을 사도직의 근원으로, 단수는 어떤 한 인간을 그 전달 매개로 생각하는 가능성을 각각 부정하는 자연스러운 대조로 읽힙니다. 지나친 신학적 의미를 부여할 필요는 없습니다. [가능성이 높음]','The plural naturally denies a human group as the source, while the singular denies an individual human being as the mediating agent. The contrast is meaningful, but it should not be overloaded theologically. [High confidence]'],['Context','갈라디아의 어떤 상황이 바울로 하여금 첫 절부터 사도권의 기원을 밝히게 했을까?','What situation in Galatia led Paul to establish the origin of his apostleship from the opening verse?','편지 전체는 다른 복음을 가르치는 이들과 바울의 복음 및 사도적 권위에 관한 논쟁을 보여 줍니다(1:6–12; 2:1–10). 다만 반대자들이 정확히 어떤 말로 바울을 공격했는지는 재구성에 신중해야 합니다. [여러 세부사항은 확정 곤란]','The letter shows conflict over a different gospel and over Paul’s gospel and apostolic authority (1:6–12; 2:1–10). The precise accusations of his opponents, however, must be reconstructed cautiously. [Some details remain uncertain]'],['Whole Bible','부활하신 그리스도와 사도적 증언은 신약 전체에서 어떻게 연결되는가?','How are the risen Christ and apostolic witness connected throughout the New Testament?','사도행전과 바울 서신에서 부활하신 그리스도에 대한 증언은 사도적 선포의 중심입니다. 바울 자신도 부활하신 그리스도의 나타나심을 자신의 사도적 증언과 연결합니다(고전 15:8–10).','Throughout Acts and Paul’s letters, witness to the risen Christ stands at the center of apostolic proclamation. Paul also connects the risen Christ’s appearance to him with his own apostolic witness (1 Cor. 15:8–10).'],['Seeing Christ','바울의 새로운 삶과 사역의 근원으로서 부활하신 그리스도는 어떤 분이신가?','Who is the risen Christ as the source of Paul’s new life and ministry?','갈 1:1의 그리스도는 과거의 스승으로만 제시되지 않습니다. 죽은 자들 가운데서 일으켜지신 살아 계신 그리스도께서 바울의 부르심과 사역의 출발점에 계십니다.','The Christ of Galatians 1:1 is not presented merely as a teacher of the past. The living Christ, raised from the dead, stands at the beginning of Paul’s calling and ministry.'],['Enjoying Christ','나는 그리스도를 과거의 인물로만 아는가, 오늘 살아 계신 분으로 누리는가?','Do I know Christ merely as a figure of the past, or enjoy Him as the living One today?','이 질문에는 하나의 객관적 정답보다 묵상이 필요합니다. 갈 1:1은 우리의 믿음이 죽은 영웅에 대한 기억이 아니라 부활하신 그리스도께 향하도록 이끕니다.','This question calls for reflection rather than a single objective answer. Galatians 1:1 directs faith not toward the memory of a dead hero but toward the risen Christ.'],['Expressing Christ','내 삶과 봉사에서 사람들에게 나 자신보다 그리스도가 보이게 하려면 무엇이 달라져야 하는가?','What must change in my life and service for people to see Christ rather than myself?','정답을 강요하기보다 갈 2:20과 함께 묵상할 수 있습니다. 핵심 질문은 내 지식·능력·인정을 중심에 두는가, 아니면 그리스도께서 내 안에서 사시고 나타나시도록 의존하는가입니다.','Rather than imposing one answer, this can be pondered alongside Galatians 2:20. The issue is whether my knowledge, ability, and recognition remain central, or whether I depend on Christ to live and be manifested in me.']]},
'1:2':{g:'καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοὶ, ταῖς ἐκκλησίαις τῆς Γαλατίας',e:'and all the brothers with me, to the churches of Galatia.',qs:[['Observation','왜 바울은 자신만 발신자로 제시하지 않고 “나와 함께 있는 모든 형제들”을 언급했을까?','Why does Paul mention “all the brothers with me” rather than presenting himself as the sole sender?','바울의 사도직은 사람에게서 나온 것이 아니지만 그는 고립된 개인으로 편지를 쓰지 않습니다. 함께 있는 형제들을 언급함으로써 그의 독립적인 소명과 실제적인 믿는 이들의 교제가 함께 나타납니다.','Paul’s apostleship is not derived from people, yet he does not write as an isolated individual. Mentioning the brothers with him places his independent calling alongside real fellowship with other believers.'],['Greek & Grammar','σύν(with)은 단순한 공간적 동행인가, 더 깊은 교제나 동역도 암시할 수 있는가?','Does σύν (“with”) indicate mere proximity, or can it imply deeper fellowship or co-labor?','σύν 자체는 기본적으로 함께 있음을 나타냅니다. 문맥상 공동체적 연대를 암시할 수 있지만, 이 전치사 하나만으로 모든 형제들이 공동 저자이거나 모든 표현을 공식 승인했다고 단정할 수는 없습니다. [매우 확실]','σύν basically denotes being with someone. The context may imply communal solidarity, but the preposition alone does not prove that all the brothers were coauthors or formally endorsed every statement. [Very high confidence]'],['Ecclesiology','왜 “갈라디아 교회”가 아니라 “갈라디아의 교회들”이라고 복수로 말하는가?','Why does Paul say “the churches of Galatia” in the plural?','갈라디아는 한 도시가 아니라 지역이므로 그 지역 안의 여러 지역 교회들을 가리키는 것이 가장 자연스럽습니다. 이 표현은 신약의 지역 교회론을 연구하는 중요한 자료지만, 한 구절만으로 완전한 교회 행정 체계를 확정해서는 안 됩니다.','Galatia was a region rather than a single city, so the plural most naturally refers to multiple local congregations within that region. It is important evidence for New Testament ecclesiology, but one verse alone cannot establish a complete system of church administration.'],['History','바울 시대의 “갈라디아”는 정확히 어느 지역을 가리켰는가?','What geographical area did “Galatia” refer to in Paul’s time?','“갈라디아”가 민족적 북부 갈라디아를 뜻하는지 더 넓은 로마 속주를 뜻하는지는 오래된 논쟁입니다. 그래서 수신 교회들의 정확한 위치는 확정하기 어렵습니다. [여러 해석]','Whether “Galatia” denotes the ethnic territory in the north or the broader Roman province is a longstanding debate. The exact location of the recipient churches therefore remains uncertain. [Multiple interpretations]'],['Seeing Christ','서로 다른 사람들이 어떻게 그리스도 안에서 “형제들”이 되었는가?','How did different people become “brothers” in Christ?','갈라디아서 자체는 믿음과 그리스도 안에서의 하나 됨을 강조합니다(3:26–28). 형제라는 관계의 궁극적 중심은 공통된 문화가 아니라 그리스도께 속한 새로운 관계입니다.','Galatians itself emphasizes faith and oneness in Christ (3:26–28). The ultimate center of this brotherly relationship is not a shared culture but a new relationship belonging to Christ.'],['Enjoying Christ','나는 그리스도를 개인적으로 누리는 것과 다른 믿는 이들과 함께 누리는 것을 모두 알고 있는가?','Do I know both the individual and corporate enjoyment of Christ?','개인적 묵상 질문입니다. 1:1–2를 함께 보면 개인적으로 그리스도께 받은 부르심과 다른 믿는 이들과의 교제가 서로 배제되지 않는다는 방향으로 생각해 볼 수 있습니다.','This is a personal reflection question. Reading 1:1–2 together invites us to consider how a personal calling from Christ and fellowship with other believers need not exclude one another.'],['Expressing Christ','서로 다른 성격과 의견을 가진 믿는 이들을 대할 때 그리스도가 어떻게 표현될 수 있는가?','How can Christ be expressed in the way I treat believers with different personalities and opinions?','갈 5:13–26은 사랑으로 섬김, 성령을 따라 행함, 사랑·화평·온유 같은 열매를 구체적인 방향으로 제시합니다. 차이를 없애는 것이 아니라 차이 속에서 그리스도의 성품이 나타나는가를 묻게 합니다.','Galatians 5:13–26 points toward serving through love, walking by the Spirit, and the fruit of love, peace, and gentleness. The issue is not eliminating differences but whether Christ’s character is expressed amid them.']]},
'1:3':{g:'χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ',e:'Grace to you and peace from God our Father and the Lord Jesus Christ.',qs:[['Observation','왜 “은혜”가 “평안”보다 먼저 나오는가? 이 순서에 의미가 있는가?','Why does “grace” come before “peace”? Is there significance to this order?','바울의 인사에서 χάρις와 εἰρήνη의 순서는 반복적으로 나타납니다. 은혜가 논리적으로 평안의 근원이라고 신학적으로 연결할 수 있지만, 어순 하나만으로 인과관계를 확정하는 것은 조심해야 합니다. [가능성이 높음]','The order χάρις and εἰρήνη recurs in Paul’s greetings. Grace can theologically be related to peace as its ground, but the word order alone should not be made to prove a strict causal sequence. [High confidence]'],['Greek & Grammar','χάρις는 1세기 헬라어에서 어떤 의미 범위를 가지고 있었는가?','What range of meanings did χάρις have in first-century Greek?','χάρις는 호의, 은총, 감사, 은혜로운 선물 등의 의미 범위를 가질 수 있습니다. 바울에게서는 특히 하나님이 그리스도 안에서 베푸시는 은혜라는 신학적 의미가 강하게 발전합니다.','χάρις can denote favor, graciousness, gratitude, or a gracious gift. In Paul it is developed especially as God’s grace given in and through Christ.'],['Greek & Grammar','하나의 ἀπό가 “하나님 우리 아버지”와 “주 예수 그리스도”를 함께 지배한다고 볼 수 있는가?','Can the single ἀπό be understood as governing both “God our Father” and “the Lord Jesus Christ”?','네. 문법적으로 하나의 ἀπό가 καί로 연결된 두 표현 전체에 자연스럽게 적용됩니다. 따라서 아버지와 주 예수 그리스도가 함께 은혜와 평안의 근원으로 제시됩니다. [매우 확실]','Yes. Grammatically, the single ἀπό naturally governs both coordinated expressions joined by καί. Thus the Father and the Lord Jesus Christ are presented together as the source of grace and peace. [Very high confidence]'],['Whole Bible','민수기 6:24–26의 제사장적 축복과 “은혜와 평안” 사이에는 어떤 유사점과 차이가 있는가?','What similarities and differences exist between Numbers 6:24–26 and Paul’s “grace and peace”?','민 6:24–26은 여호와의 은혜로운 얼굴과 평강을 함께 축복합니다. 갈 1:3도 은혜와 평안을 하나님에게서 오는 선물로 말하지만, 주 예수 그리스도를 그 근원과 함께 명시한다는 점에서 신약적 그리스도론의 빛이 더해집니다.','Numbers 6:24–26 joins the LORD’s gracious favor with peace. Galatians 1:3 likewise treats grace and peace as divine gifts, while explicitly placing the Lord Jesus Christ with their source, adding the light of New Testament Christology.'],['Whole Bible','로마서 5:1–2에서 “평안”과 “은혜”는 어떤 관계로 나타나는가?','How are “peace” and “grace” related in Romans 5:1–2?','롬 5:1–2에서는 믿음으로 의롭다 하심을 받아 하나님과 평화를 누리고, 그리스도를 통해 은혜 안에 들어섰다고 말합니다. 두 개념 모두 그리스도의 구원 사역과 연결됩니다.','Romans 5:1–2 speaks of peace with God through justification by faith and of access through Christ into grace. Both realities are connected with Christ’s saving work.'],['Seeing Christ','본문은 은혜와 평안의 근원을 그리스도 자신과 어떻게 연결하는가?','How does the text connect the source of grace and peace with Christ Himself?','“ἀπὸ … καὶ …” 구조는 은혜와 평안이 하나님 아버지와 주 예수 그리스도로부터 온다고 말합니다. 따라서 그리스도는 단순한 인간 전달자가 아니라 아버지와 함께 이 축복의 근원 쪽에 놓여 있습니다.','The construction “ἀπὸ … καὶ …” states that grace and peace come from God the Father and the Lord Jesus Christ. Christ therefore stands not as a merely human messenger but with the Father on the source side of these blessings.'],['Enjoying Christ','내게 평안이 없을 때 나는 환경의 변화보다 평안의 근원이신 그리스도께 돌이키는가?','When I lack peace, do I seek changed circumstances first, or turn to Christ as the source of peace?','개인적 묵상 질문입니다. 본문이 강조하는 출발점은 평안을 환경 자체에서 찾는 것이 아니라 하나님 아버지와 주 예수 그리스도에게서 받는 것입니다.','This is a personal reflection question. The text directs us to receive peace from God the Father and the Lord Jesus Christ rather than treating circumstances themselves as its ultimate source.'],['Living Christ','은혜로 사는 것은 수동적인 삶인가, 아니면 그리스도께 의존하여 행동하는 삶인가?','Is living by grace passive, or is it a life of acting in dependence on Christ?','바울에게 은혜는 수동성을 뜻하지 않습니다. 그는 고전 15:10에서 하나님의 은혜와 자신의 수고를 함께 말합니다. 핵심은 행동의 부재가 아니라 그 행동의 근원과 능력이 어디에 있는가입니다.','For Paul, grace does not mean passivity. In 1 Corinthians 15:10 he speaks of God’s grace together with his own labor. The issue is not the absence of action but the source and power of that action.'],['Expressing Christ','사람들이 나를 만난 후 나의 지식보다 그리스도의 은혜와 평안을 맛보는가?','After people encounter me, do they taste the grace and peace of Christ more than they remember my knowledge?','이것은 정답형 질문이 아니라 자기 점검을 위한 질문입니다. 갈 5:22–23의 성령의 열매와 함께 자신의 말과 태도에서 사랑·화평·온유가 실제로 나타나는지 살펴볼 수 있습니다.','This is a question for self-examination rather than a fixed-answer question. Alongside Galatians 5:22–23, we can ask whether love, peace, and gentleness are actually becoming visible in our words and conduct.']]}}

function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function wordLine(vd){return `<div class="wordline">${vd.pairs.map(([g,p,c],i)=>`<button type="button" class="wordpair" data-word="${i}" aria-label="${escapeHtml(g)} meaning"><span class="gr ${c}">${g}</span><span class="pron">${p}</span></button>`).join('')}</div>`;}
let popupTrigger=null;
function hideWordPopup(restore=false){wordpopup.hidden=true;if(restore&&popupTrigger)popupTrigger.focus();popupTrigger=null;}
function showWordPopup(button){const i=Number(button.dataset.word),w=wordNotes[current][i],box=button.getBoundingClientRect();if(!w||w.g!==verseDisplay[current].pairs[i][0])return;popupTrigger=button;wordpopup.innerHTML=`<div class="pophead"><div><div class="popgreek">${escapeHtml(w.g)}</div><div class="poppron" lang="ko" aria-label="한글 코이네 발음">${escapeHtml(w.koineKo)}</div></div><button type="button" class="popclose" aria-label="Close word meaning">×</button></div><div class="popmeaning">${escapeHtml(w.en)}</div><div class="popko">${escapeHtml(w.ko)}</div><div class="popgrammar"><b>Lemma</b> ${escapeHtml(w.lemma)}<br><b>문법</b> ${escapeHtml(w.grammar)}</div><div class="popnote">${escapeHtml(w.note)}</div>`;wordpopup.hidden=false;wordpopup.style.left=Math.min(Math.max(12,box.left),innerWidth-362)+'px';wordpopup.style.top=Math.min(box.bottom+8,innerHeight-wordpopup.offsetHeight-12)+'px';wordpopup.style.bottom='auto';wordpopup.querySelector('.popclose').onclick=()=>hideWordPopup(true);}
verse.addEventListener('click',e=>{const b=e.target.closest('[data-word]');if(b){if(!wordpopup.hidden&&popupTrigger===b)hideWordPopup();else showWordPopup(b);}});
document.addEventListener('click',e=>{if(!wordpopup.hidden&&!wordpopup.contains(e.target)&&!e.target.closest('[data-word]'))hideWordPopup();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!wordpopup.hidden)hideWordPopup(true);});
