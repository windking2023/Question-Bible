const fullQuestions={"1:1": [["Observation", "왜 Παῦλος(Paul)이 편지의 첫 단어로 나오는가? 고대 편지 형식과 어떤 관계가 있는가?", "Why does Παῦλος (Paul) appear as the first word of the letter? How does this relate to ancient letter-writing conventions?"], ["Observation", "왜 바울은 자신의 이름 바로 뒤에 ἀπόστολος(사도)라고 했을까?", "Why does Paul place ἀπόστολος (“apostle”) immediately after his name?"], ["Comparison", "바울의 다른 편지들의 시작과 비교하면 갈라디아서의 자기소개는 무엇이 다른가?", "Compared with the openings of Paul’s other letters, what is distinctive about his self-identification in Galatians?"], ["Context", "갈라디아의 어떤 상황이 바울로 하여금 첫 절부터 자신의 사도권을 변호하게 했을까?", "What situation in Galatia led Paul to defend his apostleship from the opening verse?"], ["Greek & Grammar", "ἀπόστολος의 기본 의미는 무엇이며 당시 헬라어에서는 어떻게 사용되었는가?", "What is the basic meaning of ἀπόστολος, and how was the word used in contemporary Greek?"], ["Whole Bible", "신약에서 ἀπόστολος는 오직 열두 사도에게만 사용되는가, 아니면 더 넓게 사용되는가?", "In the New Testament, is ἀπόστολος used only of the Twelve, or does it have a broader range?"], ["Whole Bible", "열두 사도 가운데 한 사람이 아니었던 바울은 무엇을 근거로 자신을 사도라고 부르는가?", "On what basis does Paul call himself an apostle even though he was not one of the Twelve?"], ["Greek & Grammar", "οὐκ ἀπ᾽ ἀνθρώπων에서 ἀπό는 어떤 기능을 하는가?", "What function does ἀπό have in οὐκ ἀπ᾽ ἀνθρώπων?"], ["Greek & Grammar", "왜 ἀνθρώπων은 복수형인가?", "Why is ἀνθρώπων plural?"], ["Context", "“사람들에게서 난 것이 아니다”라는 말은 정확히 무엇을 부정하는가?", "What exactly does Paul deny by saying “not from men”?"], ["Context", "갈라디아서 안에는 사람들이 바울의 사도권을 의심했다는 어떤 증거가 있으며, 그 증거의 한계는 무엇인가?", "What evidence within Galatians suggests that Paul’s apostleship was being questioned, and what are the limits of that evidence?"], ["Greek & Grammar", "왜 바울은 οὐκ ἀπ᾽ ἀνθρώπων 뒤에 다시 οὐδὲ δι᾽ ἀνθρώπου라고 두 번째 부정을 덧붙이는가?", "Why does Paul add a second denial, οὐδὲ δι᾽ ἀνθρώπου, after οὐκ ἀπ᾽ ἀνθρώπων?"], ["Greek & Grammar", "διά + 속격은 여기서 어떤 의미를 갖는가?", "What does διά with the genitive mean here?"], ["Greek & Grammar", "왜 바울은 ἀπό(from)와 διά(through)라는 서로 다른 전치사를 사용했을까? 두 표현은 어떤 차이를 만드는가?", "Why does Paul use two different prepositions, ἀπό (“from”) and διά (“through”)? What distinction does each expression make?"], ["Greek & Grammar", "왜 ἀνθρώπων은 복수인데 ἀνθρώπου는 단수인가?", "Why is ἀνθρώπων plural while ἀνθρώπου is singular?"], ["Greek & Grammar", "두 부정은 단순한 반복인가, 아니면 사도직의 근원과 전달 수단이라는 서로 다른 가능성을 부정하는가?", "Are the two denials merely repetitive, or do they reject two distinct possibilities—the source and the mediating agency of Paul’s apostleship?"], ["Greek & Grammar", "ἀλλά(but)는 앞의 두 부정을 어떻게 뒤집는가?", "How does ἀλλά (“but”) reverse the two preceding denials?"], ["Seeing Christ", "왜 “한 사람을 통하여”와 “예수 그리스도를 통하여”가 직접 대조되는가?", "Why is “through a man” placed in direct contrast with “through Jesus Christ”?"], ["Whole Bible", "바울의 생애에서 부활하신 그리스도께 직접 부름받은 사건은 무엇인가?", "What event in Paul’s life involved his direct calling by the risen Christ?"], ["Whole Bible", "사도행전의 바울 회심·소명 기사들과 갈라디아서의 바울 자신의 설명은 어떻게 비교되는가?", "How do the accounts of Paul’s conversion and calling in Acts compare with Paul’s own account in Galatians?"], ["Greek & Grammar", "διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρός에서 하나의 διά가 두 표현을 함께 지배하는가?", "Does the single διά govern both Ἰησοῦ Χριστοῦ and θεοῦ πατρός?"], ["Greek & Grammar", "예수 그리스도와 하나님 아버지가 καί로 연결되어 같은 문법 구조 안에 놓인 것은 어떤 의미가 있는가?", "What is the significance of Jesus Christ and God the Father being joined by καί within the same grammatical construction?"], ["Theology", "이 구절을 그리스도의 신성에 대한 증거로 사용할 수 있는가? 그렇다면 본문이 실제로 말하는 범위는 어디까지이며, 어디서부터 과도한 추론이 되는가?", "Can this verse be used as evidence for the deity of Christ? If so, how far does the text itself allow us to go, and at what point would we be reading more into the text than it actually says?"], ["Theology", "왜 바울은 단순히 θεός가 아니라 θεὸς πατήρ, 곧 “하나님 아버지”라고 하는가?", "Why does Paul say θεὸς πατήρ (“God the Father”) rather than simply θεός (“God”)?"], ["Greek & Grammar", "τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν이라는 분사구는 문법적으로 무엇을 수식하는가?", "What does the participial phrase τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν modify grammatically?"], ["Greek & Grammar", "ἐγείραντος의 사전형과 형태 분석은 무엇인가?", "What is the lexical form and morphological parsing of ἐγείραντος?"], ["Greek & Grammar", "ἐγείρω는 일상적인 “일으키다”와 죽은 자의 “부활시키다”라는 의미를 어떻게 갖는가?", "How does ἐγείρω range from the ordinary sense “raise up” to the resurrection sense “raise from the dead”?"], ["Greek & Grammar", "ἐκ νεκρῶν은 단순히 “죽음으로부터”라는 표현과 어떤 뉘앙스 차이가 있는가?", "What nuance does ἐκ νεκρῶν carry compared with simply saying “from death”?"], ["Greek & Grammar", "αὐτόν은 누구를 가리키며 문법적으로 어떻게 확인할 수 있는가?", "To whom does αὐτόν refer, and how can this be established grammatically?"], ["Context", "왜 바울은 자기소개 첫 절에서부터 부활을 언급하는가?", "Why does Paul mention the resurrection already in the first verse of his self-introduction?"], ["Whole Bible", "부활하신 그리스도를 만난 사건과 바울의 사도직은 어떤 관계가 있는가?", "What relationship exists between Paul’s encounter with the risen Christ and his apostleship?"], ["Whole Bible", "초기 교회에서 부활의 증언과 사도적 직분은 어떻게 연결되는가?", "How are resurrection witness and apostolic ministry connected in the early church?"], ["Context", "십자가가 중심 주제인 갈라디아서에서 왜 첫 절은 십자가보다 부활을 먼저 언급하는가?", "In a letter where the cross is central, why does the opening verse mention resurrection before the cross?"], ["Context", "1:1의 “사람들에게서가 아니다”는 1:10의 “사람들을 기쁘게 하랴”와 어떻게 연결되는가?", "How does “not from men” in 1:1 relate to Paul’s question about pleasing people in 1:10?"], ["Context", "1:1의 사도직의 기원과 1:11–12의 복음의 기원은 어떻게 서로 연결되는가?", "How is the origin of Paul’s apostleship in 1:1 related to the origin of his gospel in 1:11–12?"], ["Context", "1:15–16은 1:1을 어떻게 더 자세히 설명하는가?", "How do 1:15–16 further explain 1:1?"], ["Context", "바울과 예루살렘 사도들의 관계는 갈라디아서 논증에서 왜 중요한가?", "Why is Paul’s relationship with the Jerusalem apostles important to the argument of Galatians?"], ["Context", "바울이 예루살렘에서 유래하지 않았다는 것과 예루살렘 사도들과 아무 관계가 없다는 것은 같은 말인가?", "Is saying that Paul’s apostleship did not derive from Jerusalem the same as saying he had no relationship with the Jerusalem apostles?"], ["Theology", "갈 1:1은 사도적 권위, 교회의 권위, 그리스도의 권위의 관계를 생각하는 데 어떤 질문을 제기하는가?", "What questions does Galatians 1:1 raise about the relationship among apostolic authority, church authority, and Christ’s authority?"], ["Theology", "오늘날 누군가 “나는 사람에게서가 아니라 하나님께 직접 받았다”고 주장한다면 무엇을 기준으로 시험해야 하는가?", "If someone today claims, “I received this directly from God, not from people,” by what criteria should such a claim be tested?"], ["Observation", "이 한 절 안에서 가장 중요한 대조 구조들은 무엇인가?", "What are the major contrast structures within this single verse?"], ["Observation", "바울이 1절에서 확립하려는 핵심 사실을 한 문장으로 요약한다면 무엇인가?", "If you summarized in one sentence the central fact Paul establishes in verse 1, what would it be?"], ["Seeing Christ", "바울이 사람이나 자신의 능력이 아니라 예수 그리스도를 자신의 사도직의 근원과 기준으로 제시하는 것은 그리스도가 바울에게 어떤 분이셨음을 보여 주는가?", "What does Paul’s presentation of Jesus Christ rather than people or his own ability as the source and reference point of his apostleship show about who Christ was to him?"], ["Seeing Christ", "바울에게 그리스도는 단지 가르침의 주제였는가, 아니면 그의 삶과 사역을 발생시키고 지시하신 살아 계신 인격이셨는가?", "Was Christ merely the subject of Paul’s teaching, or the living Person who generated and directed his life and ministry?"], ["Seeing Christ", "갈라디아서 1:1의 그리스도는 단지 과거에 땅에서 사셨던 예수님으로 제시되는가, 아니면 죽음을 통과하고 부활하여 지금 살아 계신 그리스도로 제시되는가?", "Does Galatians 1:1 present Christ merely as Jesus who once lived on earth, or as the Christ who passed through death, was raised, and is now living?"], ["Seeing Christ", "부활하신 그리스도를 실제로 만나는 것은 한 사람의 삶의 방향을 어떻게 바꿀 수 있는가?", "How can a genuine encounter with the risen Christ change the direction of a person’s life?"], ["Enjoying Christ", "나는 그리스도를 연구의 대상으로만 알고 있는가, 아니면 오늘 말씀하시고 역사하시는 살아 계신 분으로 알고 있는가?", "Do I know Christ merely as an object of study, or as the living One who speaks and works today?"], ["Enjoying Christ", "현재 나의 어떤 상황에서 부활하신 그리스도의 실재가 특별히 필요한가?", "In what present situation do I especially need the reality of the risen Christ?"], ["Enjoying Christ", "내가 약하거나 실패할 때 더 강한 결심을 하는가, 아니면 부활 생명이신 그리스도께 돌이키는가?", "When I am weak or fail, do I make stronger resolutions, or turn to Christ as resurrection life?"], ["Enjoying Christ", "바울의 새로운 삶의 출발점이 자기 개선이 아니라 부활하신 그리스도였다면, 나의 그리스도인 생활에서 “자신을 개선하려는 노력”과 “그리스도를 살고 누리는 것”은 어떻게 다른가?", "If the starting point of Paul’s new life was not self-improvement but the risen Christ, what is the difference in my Christian life between trying to improve myself and living and enjoying Christ?"], ["Living Christ", "나는 하나님을 섬길 때 사람의 인정·칭찬·평가에 얼마나 영향을 받는가?", "When I serve God, how much am I influenced by human recognition, praise, or evaluation?"], ["Living Christ", "“주님께 직접 받았다”는 말을 교통과 검증을 거부하는 구실로 사용할 위험은 없는가?", "Is there a danger of using the claim “I received it directly from the Lord” as an excuse to reject fellowship and testing?"], ["Living Christ", "나의 봉사에는 자기 확신이 더 많이 나타나는가, 아니면 그리스도께 대한 의존이 더 많이 나타나는가?", "Does my service display more self-confidence or more dependence on Christ?"], ["Expressing Christ", "부활하신 그리스도께서 내 안에 살아 계신다면 그분은 나의 말, 결정, 다른 사람을 대하는 방식에서 어떻게 나타나야 하는가?", "If the risen Christ lives in me, how should He appear in my speech, decisions, and treatment of others?"], ["Expressing Christ", "사람의 인정에서 자유로운 것은 사람을 무시하는 것이 되는가, 아니면 오히려 더 자유롭게 사랑하고 섬기게 하는가?", "Does freedom from human approval lead to despising people, or can it free us to love and serve them more genuinely?"], ["Expressing Christ", "내가 사람들에게 나 자신의 지식·경험·영성을 보여 주는 것과 그리스도를 표현하는 것은 어떻게 다른가?", "What is the difference between displaying my own knowledge, experience, or spirituality to others and expressing Christ?"], ["Expressing Christ", "사람들이 나와 시간을 보낸 뒤 “성경을 많이 아는 사람”만 기억하는가, 아니면 그리스도의 어떠함을 조금이라도 느끼는가?", "After people spend time with me, do they merely remember “a person who knows the Bible,” or do they sense something of Christ?"], ["Expressing Christ", "어려움과 실패 가운데서도 부활하신 그리스도가 실제라면 다른 사람들은 내게서 무엇을 볼 수 있어야 하는가?", "If the risen Christ is real in me, what should others be able to see in me amid difficulty and failure?"], ["Whole Bible", "갈 1:1의 “예수 그리스도를 통하여”와 갈 2:20의 “그리스도께서 내 안에 사신다”는 말씀은 어떻게 연결될 수 있는가?", "How might “through Jesus Christ” in Galatians 1:1 relate to “Christ lives in me” in Galatians 2:20?"], ["Living Christ", "그리스도인 생활의 목표는 단지 그리스도를 외적으로 모방하는 것인가, 아니면 그분의 생명이 우리 안에서 살아지고 표현되는 것인가?", "Is the goal of the Christian life merely to imitate Christ outwardly, or for His life to be lived and expressed through us?"], ["Whole Bible", "갈 4:19의 “그리스도께서 너희 안에 형상을 이루시기까지”는 부활하신 그리스도가 믿는 이 안에서 표현되는 것과 어떻게 연결되는가?", "How does Galatians 4:19, “until Christ is formed in you,” relate to the risen Christ being expressed in the believer?"], ["Expressing Christ", "갈라디아서 1:1을 연구한 후 내가 더 많이 알게 된 것은 바울의 사도권뿐인가, 아니면 그 모든 것의 배후에 계신 살아 계시고 부활하신 그리스도를 조금 더 보게 되었는가? 그리고 내가 본 그리스도께서 오늘 내 안에서 사시고 나를 통하여 표현되시도록 나는 어떻게 그분께 열 수 있는가?", "After studying Galatians 1:1, have I merely learned more about Paul’s apostleship, or have I seen more of the living and risen Christ behind it all? How can I open myself to Him today so that the Christ I have seen may live in me and be expressed through me?"]], "1:2": [["Observation", "왜 바울은 자신만 편지의 발신자로 제시하지 않고 “나와 함께 있는 모든 형제들”을 함께 언급했을까?", "Why does Paul not present himself as the sole sender of the letter, but also mention “all the brothers with me”?"], ["Observation", "“모든 형제들”은 구체적으로 누구였을까? 우리는 본문이나 역사적 자료를 통해 이들을 확인할 수 있는가?", "Who exactly were “all the brothers”? Can they be identified from the text or from historical evidence?"], ["Context", "왜 바울은 그들의 이름을 하나씩 밝히지 않고 단지 “모든 형제들”이라고 했을까?", "Why does Paul refer to them simply as “all the brothers” instead of naming them individually?"], ["Comparison", "바울의 다른 편지에서는 공동 발신자들을 어떻게 소개하는가? 갈라디아서 1:2와 비교하면 무엇이 다른가?", "How does Paul identify co-senders in his other letters, and what is distinctive about Galatians 1:2?"], ["Greek & Grammar", "σύν(with)은 단순히 같은 장소에 있다는 뜻인가, 아니면 동역·교제 같은 더 깊은 관계까지 암시할 수 있는가?", "Does σύν (“with”) merely indicate being in the same place, or can it imply a deeper relationship such as fellowship or co-labor?"], ["Context", "“나와 함께 있는”이라는 표현은 이 형제들이 바울이 쓰고 있는 내용에 어느 정도 참여하거나 동의하고 있었음을 의미하는가?", "Does the expression “with me” imply that these brothers participated in or agreed with what Paul was writing? If so, to what extent?"], ["Context", "바울은 왜 자신의 사도권이 사람에게서 오지 않았다고 강하게 주장한 직후에 자신과 함께 있는 형제들을 언급하는가?", "Why does Paul mention the brothers with him immediately after strongly asserting that his apostleship did not come from human beings?"], ["Greek & Grammar", "왜 πάντες(all)가 사용되었을까? 이 단어에 특별한 강조가 있는가?", "Why does Paul use πάντες (“all”)? Does the word carry any particular emphasis here?"], ["Greek & Grammar", "ἀδελφοὶ(brothers)는 여기서 혈연관계의 형제들을 의미하는가, 아니면 그리스도 안의 믿는 이들을 의미하는가? 어떻게 판단할 수 있는가?", "Does ἀδελφοὶ (“brothers”) refer to biological brothers here, or to fellow believers in Christ? How can we determine this?"], ["History", "초기 그리스도인들이 서로를 “형제들”이라고 부른 것은 당시 사회에서 어떤 의미를 가졌을까?", "What did it mean in the social world of the early Christians for believers to call one another “brothers”?"], ["Theology", "서로 다른 민족·사회적 배경을 가진 사람들이 그리스도 안에서 “형제들”이 된다는 사실은 갈라디아서의 중심 문제와 어떤 관계가 있는가?", "How does the fact that people from different ethnic and social backgrounds became “brothers” in Christ relate to the central issues of Galatians?"], ["Observation", "왜 바울은 “갈라디아 교회”라고 하지 않고 “갈라디아의 교회들”이라고 복수로 말하는가?", "Why does Paul say “the churches of Galatia” in the plural rather than “the church of Galatia” in the singular?"], ["Greek & Grammar", "ἐκκλησία는 1세기 헬라어에서 본래 어떤 의미로 사용되었으며, 신약에서는 그 의미가 어떻게 발전하는가?", "What did ἐκκλησία originally mean in first-century Greek usage, and how is its meaning developed in the New Testament?"], ["Ecclesiology", "한 지역인 갈라디아에 여러 “교회들”이 있었다는 표현은 신약에서 지역 교회를 이해하는 데 어떤 자료를 제공하는가?", "What does the expression “churches of Galatia” contribute to our understanding of local churches in the New Testament?"], ["Comparison", "바울은 어떤 경우에는 “하나님의 교회”라고 단수로 말하고, 어떤 경우에는 “교회들”이라고 복수로 말하는가? 그 차이를 결정하는 것은 무엇인가?", "Why does Paul sometimes speak of “the church of God” in the singular and elsewhere of “churches” in the plural? What determines the difference?"], ["History", "바울 시대의 “갈라디아”는 정확히 어디를 가리켰는가?", "What geographical area did “Galatia” refer to in Paul’s time?"], ["History", "갈라디아서의 수신 지역을 설명하는 이른바 북갈라디아설과 남갈라디아설은 각각 무엇을 주장하는가?", "What do the so-called North Galatian and South Galatian theories claim about the recipients of Galatians?"], ["History", "어느 견해를 택하느냐에 따라 갈라디아서의 기록 연대와 사도행전과의 관계가 어떻게 달라지는가?", "How does the choice between these views affect the dating of Galatians and its relationship to the book of Acts?"], ["Whole Bible", "사도행전에서 바울이 방문했던 도시들 가운데 갈라디아서의 “교회들”에 포함되었을 가능성이 있는 곳들은 어디인가?", "Which cities visited by Paul in Acts may have been included among the “churches of Galatia”?"], ["Comparison", "바울의 다른 편지들의 인사말과 비교했을 때 갈라디아서의 시작에서 눈에 띄게 빠져 있는 것은 무엇인가?", "Compared with the openings of Paul’s other letters, what is noticeably absent from the opening of Galatians?"], ["Context", "그 생략은 갈라디아 교회들의 상황이 얼마나 심각했는지를 이해하는 데 도움이 되는가?", "Does this omission help us understand the seriousness of the situation in the Galatian churches?"], ["Observation", "그럼에도 바울은 그들을 여전히 “교회들”이라고 부른다. 이것은 무엇을 의미하는가?", "Yet Paul still calls them “churches.” What significance might this have?"], ["Seeing Christ", "서로 배경이 다른 사람들이 어떻게 서로 “형제들”이 될 수 있었는가? 그들을 하나의 새로운 관계 안으로 가져온 중심은 누구인가?", "How could people from different backgrounds become “brothers”? Who brought them into this new relationship?"], ["Seeing Christ", "바울과 함께 있는 형제들과 멀리 떨어진 갈라디아의 교회들을 서로 연결하고 있는 공통된 실재는 무엇인가?", "What common reality joins the brothers with Paul and the distant churches of Galatia together?"], ["Seeing Christ", "교회가 단순히 같은 생각을 가진 사람들의 모임이 아니라면, 그리스도는 교회의 존재에서 어떤 위치를 차지하시는가?", "If the church is more than a gathering of like-minded people, what place does Christ occupy in the very existence of the church?"], ["Enjoying Christ", "나는 그리스도를 개인적으로 누리는 것과 다른 믿는 이들과 함께 그리스도를 누리는 것 사이에 어떤 차이를 경험하고 있는가?", "What difference do I experience between enjoying Christ individually and enjoying Him together with other believers?"], ["Enjoying Christ", "바울처럼 강한 개인적 부르심을 받은 사람도 “나와 함께 있는 모든 형제들”이라고 말한다면, 나는 그리스도인 생활을 지나치게 개인적인 것으로 만들고 있지는 않은가?", "If even Paul, with his strong personal calling, speaks of “all the brothers with me,” am I making my Christian life too individualistic?"], ["Enjoying Christ", "나는 다른 믿는 이들을 주로 나와 의견이 맞거나 맞지 않는 사람들로 보는가, 아니면 그리스도께서 내게 주신 형제자매들로 보는가?", "Do I primarily see other believers as people who agree or disagree with me, or as brothers and sisters given to me in Christ?"], ["Expressing Christ", "그리스도께서 실제로 우리 가운데 중심이시라면, 서로 다른 성격·문화·의견을 가진 믿는 이들을 대하는 방식에서 그리스도가 어떻게 나타날 수 있는가?", "If Christ is truly the center among us, how can He be expressed in the way we treat believers of different personalities, cultures, and opinions?"], ["Expressing Christ", "내가 옳다는 것을 증명하는 것과 그리스도를 표현하는 것이 충돌할 때, 나의 말과 태도에서는 어느 것이 더 쉽게 나타나는가?", "When proving that I am right conflicts with expressing Christ, which one is more readily seen in my words and attitude?"], ["Expressing Christ", "“모든 형제들”이라는 표현을 실제 교회생활에 적용한다면, 그리스도를 표현하는 공동체는 소수의 뛰어난 사람들을 중심으로 세워지는가, 아니면 모든 지체 안의 그리스도를 귀하게 여기는가?", "If we bring the expression “all the brothers” into practical church life, is a Christ-expressing community built around a few outstanding people, or does it treasure Christ in every member?"], ["Expressing Christ", "사람들이 우리의 교회생활을 보았을 때 특정 지도자, 특정 가르침, 특정 실행이 먼저 보이는가, 아니면 그 가운데 살아 계신 그리스도가 보이는가?", "When people observe our church life, do they first notice a particular leader, teaching, or practice—or do they see the living Christ among us?"], ["Context", "1절의 “사람에게서가 아니라”와 2절의 “나와 함께 있는 모든 형제들”을 함께 놓으면, 바울에게 그리스도에게서 직접 받은 권위와 다른 믿는 이들과의 교통은 서로 대립하는가?", "When we place “not from men” in verse 1 beside “all the brothers with me” in verse 2, are direct authority from Christ and fellowship with other believers opposed to one another in Paul’s experience?"], ["Living Christ", "나는 한쪽으로는 사람에게 지나치게 의존하고, 다른 한쪽으로는 “나는 주님만 따른다”고 하면서 다른 지체들을 필요로 하지 않는 두 극단 가운데 어느 쪽으로 기울기 쉬운가?", "Toward which extreme am I more inclined—depending excessively on people, or saying “I follow the Lord alone” while feeling that I do not need other members?"], ["Expressing Christ", "그리스도께서 나의 유일한 근원이시면서 동시에 나를 다른 지체들과 연결하시는 분이라면, 그러한 그리스도를 사는 사람에게서 개인적인 신실함과 몸 안의 교통은 어떻게 함께 나타날 수 있는가?", "If Christ is both my unique source and the One who joins me to other members, how can personal faithfulness and fellowship in the Body be expressed together in someone who lives Christ?"]], "1:3": [["Observation", "이 짧은 인사말에서 바울이 갈라디아인들에게 바라는 두 가지는 무엇인가?", "What are the two things Paul desires for the Galatians in this brief greeting?"], ["Observation", "왜 “은혜”가 “평안”보다 먼저 나오는가? 이 순서에 의미가 있는가?", "Why does “grace” come before “peace”? Is there significance to this order?"], ["Observation", "바울은 왜 단순히 자신의 안부를 전하지 않고 “은혜와 평안”을 말하는가?", "Why does Paul speak of “grace and peace” rather than simply offering a conventional greeting?"], ["Observation", "1절에서는 “예수 그리스도와 하나님 아버지”라고 했는데, 3절에서는 왜 “하나님 우리 아버지와 주 예수 그리스도”라고 하는가?", "Verse 1 speaks of “Jesus Christ and God the Father.” Why does verse 3 say “God our Father and the Lord Jesus Christ”?"], ["Greek & Grammar", "χάρις는 1세기 헬라어에서 어떤 의미 범위를 가지고 있었는가?", "What range of meanings did χάρις have in first-century Greek?"], ["History", "χάρις는 일반적인 헬라어 편지 인사말과 어떤 관계가 있는가?", "How is χάρις related to conventional greetings in Greek letters?"], ["Theology", "바울에게 χάρις는 단순히 하나님의 호의인가, 아니면 하나님께서 실제로 사람 안에서 역사하시는 것까지 포함하는가?", "For Paul, is χάρις merely God’s favor, or does it also include God’s active working in a person?"], ["Context", "갈라디아서 전체에서 “은혜”는 어떤 중요한 순간들에 다시 등장하는가?", "At what crucial points does “grace” reappear throughout Galatians?"], ["Theology", "“은혜”를 단순히 받을 자격이 없는 사람에게 주시는 호의라고 정의하는 것은 충분한가? 무엇을 설명하고 무엇을 놓칠 수 있는가?", "Is it sufficient to define “grace” simply as “unmerited favor”? What does that definition explain, and what might it leave out?"], ["Greek & Grammar", "εἰρήνη는 단순히 마음이 편안한 상태를 의미하는가?", "Does εἰρήνη simply mean a state of inner calm?"], ["Whole Bible", "εἰρήνη와 히브리어 shalom은 어떤 관계가 있는가?", "What relationship exists between εἰρήνη and the Hebrew shalom?"], ["Observation", "바울이 “은혜와 평안”이라고 했을 때 이것은 두 개의 독립적인 축복인가, 아니면 서로 관계가 있는가?", "When Paul says “grace and peace,” are these two independent blessings, or are they related?"], ["Context", "갈라디아서 후반부의 갈등·육체·성령·사랑이라는 주제와 1:3의 “평안”은 어떻게 연결될 수 있는가?", "How might the “peace” of 1:3 relate to the later Galatian themes of conflict, the flesh, the Spirit, and love?"], ["Greek & Grammar", "ὑμῖν은 단수인가 복수인가? 이 작은 문법적 사실은 이 편지의 수신 대상을 이해하는 데 어떤 의미가 있는가?", "Is ὑμῖν singular or plural? What does this small grammatical detail contribute to our understanding of the recipients?"], ["Ecclesiology", "은혜와 평안은 개인에게만 주어지는 것인가, 아니면 교회 공동체가 함께 경험할 수 있는 것인가?", "Are grace and peace given only to individuals, or can they also be experienced corporately by a community of believers?"], ["Greek & Grammar", "1절에서도 등장했던 ἀπό가 여기서는 어떤 기능을 하는가?", "What function does ἀπό, which already appeared in verse 1, have here?"], ["Observation", "은혜와 평안의 근원은 누구라고 본문이 명시하는가?", "Whom does the text explicitly identify as the source of grace and peace?"], ["Greek & Grammar", "하나의 ἀπό가 “하나님 우리 아버지”와 “주 예수 그리스도”를 함께 지배한다고 볼 수 있는가?", "Can the single preposition ἀπό be understood as governing both “God our Father” and “the Lord Jesus Christ”?"], ["Theology", "그렇다면 바울이 은혜와 평안의 근원으로 아버지와 예수 그리스도를 나란히 놓은 것은 그리스도론적으로 어떤 의미를 가질 수 있는가?", "If so, what Christological significance might there be in Paul placing the Father and Jesus Christ together as the source of grace and peace?"], ["Theology", "이 문법적 구조에서 그리스도의 신성에 관하여 어디까지 말할 수 있으며, 어디부터는 본문보다 앞서가는 주장이 되는가?", "How far may we legitimately reason from this grammatical structure concerning Christ’s deity, and at what point would we go beyond what the text itself establishes?"], ["Theology", "왜 바울은 단순히 “하나님”이라고 하지 않고 “하나님 우리 아버지”라고 하는가?", "Why does Paul say not merely “God,” but “God our Father”?"], ["Context", "여기서 “우리”에는 누구까지 포함되는가?", "Who is included in the word “our” here?"], ["Whole Bible", "“우리 아버지”라는 표현은 이후 갈라디아서의 아들의 명분, 아들의 영, “아바 아버지”라는 주제와 어떻게 연결되는가?", "How does the expression “our Father” anticipate the later themes in Galatians of sonship, the Spirit of the Son, and the cry “Abba, Father”?"], ["Greek & Grammar", "κύριος(Lord)는 당시 일반 헬라어에서 어떤 의미로 사용될 수 있었는가?", "What meanings could κύριος (“Lord”) carry in ordinary Greek usage of the period?"], ["Whole Bible", "LXX에서 κύριος는 하나님의 이름과 관련하여 어떻게 사용되는가?", "How is κύριος used in the Septuagint in relation to the divine name?"], ["Theology", "그렇다면 바울이 예수께 κύριος라는 칭호를 사용하는 것을 어느 정도까지 중요하게 보아야 하는가?", "How much Christological significance should we attach to Paul’s use of κύριος for Jesus?"], ["Theology", "“예수”, “그리스도”, “주”는 각각 무엇을 말하며, 세 표현이 함께 놓였을 때 어떤 완전한 그림을 만드는가?", "What does each designation—“Jesus,” “Christ,” and “Lord”—convey, and what fuller picture emerges when all three are brought together?"], ["Whole Bible", "성경의 시작에서 인간이 잃어버린 하나님과의 관계와 1:3의 “은혜와 평안” 사이에 어떤 큰 성경적 이야기가 존재하는가?", "What larger biblical story connects humanity’s lost relationship with God in Genesis with the “grace and peace” of Galatians 1:3?"], ["Whole Bible", "민수기 6:24–26의 제사장적 축복과 바울의 “은혜와 평안” 사이에는 어떤 유사점과 차이가 있는가?", "What similarities and differences can be observed between the priestly blessing of Numbers 6:24–26 and Paul’s greeting of “grace and peace”?"], ["Whole Bible", "구약의 선지자들이 약속한 종말론적 평화와 바울의 εἰρήνη 사이에는 어떤 관계가 있는가?", "What relationship exists between the eschatological peace promised by the Old Testament prophets and Paul’s εἰρήνη?"], ["Whole Bible", "예수님께서 제자들에게 주신 평안에 관한 말씀들은 갈라디아서 1:3을 이해하는 데 어떤 빛을 주는가?", "How do Jesus’ words about giving peace to His disciples illuminate Galatians 1:3?"], ["Whole Bible", "로마서 5:1–2에서 “평안”과 “은혜”는 어떤 관계로 나타나는가?", "How are “peace” and “grace” related in Romans 5:1–2?"], ["Whole Bible", "에베소서 2장에서 그리스도께서 단순히 평안을 주시는 것과 그분 자신이 “우리의 평안”이시라는 것 사이에는 어떤 차이가 있는가?", "In Ephesians 2, what is the difference between Christ merely “giving” peace and Christ Himself being “our peace”?"], ["Context", "1:3의 “은혜”와 1:6의 “그리스도의 은혜 안에서 너희를 부르신 분”은 어떻게 연결되는가?", "How is the “grace” of 1:3 related to the One who “called you in the grace of Christ” in 1:6?"], ["Context", "2:21의 “나는 하나님의 은혜를 무효화하지 않는다”는 말은 1:3의 은혜를 어떻게 더 깊게 설명하는가?", "How does Paul’s statement in 2:21, “I do not nullify the grace of God,” deepen our understanding of the grace mentioned in 1:3?"], ["Context", "5:4의 “은혜에서 떨어졌다”는 표현까지 연결하면, 갈라디아서에서 은혜와 율법은 어떤 관계에 놓이는가?", "When 5:4 speaks of having “fallen away from grace,” what relationship between grace and law emerges within Galatians?"], ["Context", "5:22의 성령의 열매에 “평안”이 다시 등장한다는 사실은 1:3의 평안을 이해하는 데 어떤 도움을 주는가?", "How does the reappearance of “peace” as fruit of the Spirit in 5:22 help us understand the peace of 1:3?"], ["Seeing Christ", "본문은 은혜와 평안을 그리스도와 분리하여 생각할 수 있게 하는가, 아니면 그 근원을 그리스도 자신에게 연결하는가?", "Does the text allow us to think of grace and peace apart from Christ, or does it connect their very source with Christ Himself?"], ["Seeing Christ", "그리스도께서 단순히 은혜를 전달하는 분이 아니라 은혜의 근원과 연결되어 계신다면, 이것은 내가 그리스도를 이해하는 방식에 어떤 변화를 주는가?", "If Christ is not merely a messenger of grace but is identified with its source, how does this change the way I understand Him?"], ["Seeing Christ", "“주 예수 그리스도”라는 한 표현 안에서 나는 그분의 인성, 메시아이심, 주권 가운데 무엇을 보고 있는가?", "Within the single expression “the Lord Jesus Christ,” what do I see concerning His humanity, His Messiahship, and His lordship?"], ["Enjoying Christ", "나는 은혜를 주로 하나님께서 내게 주시는 도움이나 축복으로 생각하는가, 아니면 그리스도와의 실제적인 관계 안에서 경험하고 있는가?", "Do I think of grace mainly as help or blessing that God gives me, or do I experience it within a living relationship with Christ?"], ["Enjoying Christ", "내게 평안이 없을 때 나는 먼저 환경이 바뀌기를 원하는가, 아니면 평안의 근원이신 하나님과 그리스도께 돌이키는가?", "When I lack peace, do I first seek a change in my circumstances, or do I turn to God and Christ as the source of peace?"], ["Enjoying Christ", "은혜가 나의 노력과 반대되는 것이라면, 그리스도인 생활에서 나는 실제로 무엇을 의지하여 살고 있는가?", "If grace stands over against reliance on my own effort, what am I actually depending on in my Christian life?"], ["Enjoying Christ", "오늘 하루 내가 그리스도를 알고 있는 것과 실제로 그분을 은혜로 받아들이고 누리는 것 사이에는 어떤 차이가 있는가?", "What is the difference today between merely knowing about Christ and actually receiving and enjoying Him as grace?"], ["Living Christ", "은혜로 사는 것은 수동적으로 아무것도 하지 않는 것인가, 아니면 그리스도께 의존하여 행동하는 다른 종류의 삶인가?", "Does living by grace mean passively doing nothing, or does it mean a different kind of living and acting in dependence on Christ?"], ["Living Christ", "내가 압박을 받을 때 나에게서 자연스럽게 나오는 것은 자기방어·염려·분노인가, 아니면 그리스도에게서 오는 평안인가?", "When I am under pressure, what naturally comes out of me—self-defense, anxiety, anger, or the peace that comes from Christ?"], ["Living Christ", "“하나님 우리 아버지”가 실제라면, 나는 오늘 하나님 앞에서 종처럼 살고 있는가, 아니면 아버지를 가진 아들로 살고 있는가?", "If “God our Father” is a present reality, am I living before God today like a slave, or like a son who has a Father?"], ["Expressing Christ", "내가 은혜를 실제로 누리고 있다면 그것은 다른 사람을 대하는 방식에서 어떻게 보일 수 있는가?", "If I am truly enjoying grace, how might that become visible in the way I treat other people?"], ["Expressing Christ", "그리스도의 평안이 내 안에서 실제라면, 갈등 가운데 있는 사람들이 나를 통해 그 평안을 조금이라도 접할 수 있는가?", "If the peace of Christ is real in me, can people in the midst of conflict encounter something of that peace through me?"], ["Expressing Christ", "사람들이 나를 만난 후 나의 지식과 옳음을 더 강하게 기억하는가, 아니면 그리스도의 은혜와 평안을 조금이라도 맛보는가?", "After people encounter me, do they mainly remember my knowledge and correctness, or do they taste something of the grace and peace of Christ?"], ["Context", "바울이 갈라디아인들에게 “은혜와 평안”을 말했을 때 그것은 단순한 기독교적 인사말이었는가, 아니면 갈라디아서 전체에서 펼쳐질 복음과 그리스도인 생활을 압축하여 보여 주는 말이었는가?", "When Paul said “grace and peace” to the Galatians, was this merely a Christian greeting, or was it a compressed expression of the gospel and the Christian life that would unfold throughout the letter?"], ["Expressing Christ", "갈라디아서 1:3을 연구한 후 나는 “은혜”와 “평안”이라는 두 단어에 대해 더 많은 정보를 얻은 것인가, 아니면 그 은혜와 평안의 근원이신 하나님 아버지와 주 예수 그리스도께 조금 더 가까이 이끌렸는가?", "After studying Galatians 1:3, have I merely gained more information about the words “grace” and “peace,” or have I been drawn nearer to God our Father and the Lord Jesus Christ, from whom grace and peace come?"]]};
const fullAnswers={"1:1":[["바울은 고대 편지의 통상적인 ‘발신자—수신자—인사’ 순서를 따릅니다. Παῦλος가 첫머리에 오는 것은 자기 과시가 아니라 발신자 표기이며, 뒤따르는 ἀπόστολος가 이 편지의 논쟁적 성격을 드러냅니다. [확실]","Ancient letters commonly open with sender, recipients, and greeting. Παῦλος identifies the sender; ἀπόστολος then highlights the disputed commission. [High]"],["ἀπόστολος는 이름에 바로 붙은 동격입니다. 복음의 기원을 다투는 편지이므로 바울은 시작부터 자신의 위임이 그리스도에게 있음을 밝힙니다(1:11–12). 반대자의 정확한 비난 문구는 알려지지 않았습니다. [높음]","The appositive ἀπόστολος foregrounds Paul&#x27;s commission as his gospel is contested (1:11–12). The opponents&#x27; exact charge is unknown. [High]"],["로마서 1:1과 고린도전서 1:1도 사도직을 밝히지만, 갈라디아서에는 ‘사람들에게서도, 사람을 통해서도 아니다’라는 이중 부정이 유독 두드러집니다. 편지마다 논쟁 상황이 다릅니다. [확실]","Romans 1:1 and 1 Corinthians 1:1 also name apostleship; Galatians uniquely stresses its nonhuman source and mediation. [High]"],["1:6–9의 다른 복음, 1:11–2:10의 계시와 예루살렘 방문 논증이 이 자기소개를 설명합니다. 반대자들이 사도권을 어떻게 폄하했는지 직접 인용한 자료는 없습니다. [높음]","The rival gospel (1:6–9) and Paul&#x27;s account (1:11–2:10) explain the emphasis. No verbatim accusation survives. [High]"],["ἀπόστολος는 ‘보냄받은 사람, 사절’을 뜻하며 동사 ἀποστέλλω와 관계됩니다. 일반 용법만으로 후대의 특정 교회 직분을 모두 결정할 수 없고, 여기서는 그리스도의 위임이 핵심입니다. [높음]","ἀπόστολος means an envoy or one sent; its precise force here comes from Christ&#x27;s commission, not a later office definition. [High]"],["열두 사도 외에도 바울(갈 1:1), 바나바(행 14:14)에게 쓰이고, 빌 2:25에서는 교회가 보낸 ‘사자’를 뜻합니다. 동일 단어가 항상 동일한 권한을 뜻하지 않습니다. [확실]","The term includes Paul, Barnabas (Acts 14:14), and a church&#x27;s messenger (Phil 2:25); its authority varies by context. [High]"],["바울은 부활하신 예수의 직접적인 부르심(갈 1:12, 15–16; 고전 9:1; 15:8)을 근거로 합니다. 열두 제자와 똑같은 역사적 동행을 주장하는 것은 아닙니다. [높음]","Paul cites the risen Jesus&#x27; revelation and call (Gal 1:12, 15–16; 1 Cor 9:1; 15:8), not membership in the Twelve. [High]"],["ἀπό와 속격 ἀνθρώπων은 기원 또는 출처를 나타냅니다. 사도직이 인간 집단에서 시작된 것이 아니라는 부정입니다. [높음]","ἀπό with the genitive marks source: Paul&#x27;s commission did not originate from people. [High]"],["ἀνθρώπων은 ‘사람들’이라는 복수 속격으로 인간 집단을 포괄합니다. 특정 위원회가 실재했다는 증거가 되지는 않습니다. [높음]","The genitive plural covers human beings collectively; it does not identify a specific council. [High]"],["사람이 사도직의 궁극적 임명권자라는 생각을 부정합니다. 그가 사람들과 접촉하거나 교회의 인정을 받은 사실까지 부정하지는 않습니다(2:9). [높음]","It denies human origin of the commission, not every human relationship or later recognition (2:9). [High]"],["1:11–12에서 복음의 출처를 주장하고 1:16–24에서 초기 예루살렘 방문을 설명하며 2:6–9에서는 지도자들과의 관계를 다룹니다. 의혹의 존재는 강하게 시사되지만 정확한 공격 문구는 추정입니다. [높음/세부 불확실]","Paul defends his gospel and visits in 1:11–2:9. A challenge is likely, but its exact wording remains reconstruction. [High/uncertain details]"],["οὐδέ는 앞선 οὐκ에 두 번째 부정을 더합니다. 사람에게서 기원하지 않았을 뿐 아니라 어느 한 인간을 통로로 위임받은 것도 아니라는 강조입니다. [높음]","οὐδέ adds a second denial: neither human source nor an individual human intermediary. [High]"],["διά와 속격은 여기서 ‘~을 통하여’라는 매개 또는 행위자를 나타냅니다. ‘~때문에’라는 뜻으로 읽지 않습니다. [높음]","διά plus genitive expresses agency or mediation, “through,” in this clause. [High]"],["ἀπό는 출처, διά와 속격은 매개를 전면에 둡니다. 둘이 완전히 배타적인 기술어는 아니지만 이 문장의 병행은 두 인간적 가능성을 함께 배제합니다. [높음]","ἀπό foregrounds source; διά with genitive foregrounds agency. The paired negatives exclude both human possibilities. [High]"],["복수 ‘사람들’과 단수 ‘한 사람’의 대조는 집단적 출처와 개인적 매개를 포괄합니다. 특정 사람을 지목했다는 해석은 증거가 없습니다. [높음]","Plural “people” and singular “a person” cover collective source and individual mediation; no individual is named. [High]"],["의미상 중첩이 있지만, 출처(ἀπό)와 매개(διά)를 구별하여 강조합니다. 지나치게 엄격한 교리적 구분으로 고정하지는 마십시오. [높음]","There is overlap, but the prepositions distinguish source and mediation in emphasis. [High]"],["ἀλλά는 앞의 두 부정을 긍정적 대안으로 전환합니다. 뒤의 διά는 예수 그리스도와 하나님 아버지를 통한 위임을 말합니다. [확실]","ἀλλά reverses both denials and introduces the positive agency of Christ and the Father. [High]"],["문장의 초점은 그리스도가 바울의 사도직에서 단순한 인간 전달자가 아니라는 점입니다. 이 대비 하나만으로 성육신 교리 전체를 증명하려 해서는 안 됩니다. [높음]","Christ is more than a merely human intermediary in this commission; the contrast alone is not a full doctrine of incarnation. [High]"],["사도행전 9:3–19, 22:6–16, 26:12–18은 다메섹 길의 현현과 소명을 서술합니다. 바울도 고전 9:1, 15:8과 갈 1:15–16에서 직접 만남을 증언합니다. [높음]","Acts 9, 22, 26 narrate the Damascus encounter; Paul attests the risen Lord&#x27;s revelation in 1 Cor 9:1; 15:8 and Gal 1:15–16. [High]"],["사도행전은 이야기 형식으로 사건을 세 차례 서술하고, 갈 1장은 복음이 사람에게서 오지 않았다는 논증에 집중합니다. 세부 시간표와 대화 표현은 본문별 목적을 고려해 비교해야 합니다. [높음]","Acts narrates the event; Galatians argues for the gospel&#x27;s divine origin. Compare details with each account&#x27;s purpose in view. [High]"],["διά 하나가 속격 Ἰησοῦ Χριστοῦ와 θεοῦ πατρός를 함께 지배하는 자연스러운 읽기입니다. 두 분을 동일 인격으로 만든다는 뜻은 아닙니다. [높음]","One διά naturally governs both genitive phrases; this does not identify Father and Son as one person. [High]"],["καί가 두 분을 같은 매개 구문에 놓아 사도직의 신적 위임을 강조합니다. 문법적 병렬은 역할의 연결을 보이지만 모든 신학적 질문을 해결하지는 않습니다. [높음]","καί coordinates Christ and the Father within the same agency phrase, without settling every Christological question. [High]"],["그리스도를 하나님 아버지와 함께 신적 위임의 행위자로 놓는 점은 높은 그리스도론과 부합합니다. 그러나 이 구절 단독으로 본질·위격의 후대 교리 전체를 상세히 설명하지는 않습니다. [높음]","Christ shares the Father&#x27;s agency in the commission, consistent with high Christology; later doctrinal detail exceeds this verse alone. [High]"],["‘아버지’는 예수를 살리신 하나님을 관계적으로 부릅니다. 1:3의 ‘우리 아버지’와 4:6의 ‘아바 아버지’로 이어지지만 1:1 자체는 양자됨을 아직 설명하지 않습니다. [높음]","“Father” names God relationally as the one who raised Jesus; adoption is developed later (4:6). [High]"],["관사 τοῦ와 부정과거 능동 분사 ἐγείραντος는 속격 남성 단수로 앞의 θεοῦ πατρός, 곧 하나님 아버지를 한정합니다. αὐτόν은 그리스도입니다. [매우 높음]","τοῦ ἐγείραντος is genitive masculine singular, modifying God the Father; αὐτόν refers to Christ. [Very high]"],["사전형은 ἐγείρω입니다. ἐγείραντος는 부정과거 능동 분사, 남성 단수 속격이며 관사 τοῦ와 결합해 ‘일으키신 분’을 뜻합니다. [매우 높음]","Lemma ἐγείρω; aorist active participle, genitive masculine singular, articular with τοῦ. [Very high]"],["ἐγείρω는 잠에서 깨우거나 일으키는 동사이지만, 여기서는 ἐκ νεκρῶν과 함께 죽은 예수를 살리신 사건을 뜻합니다. 의미는 문맥이 결정합니다. [확실]","ἐγείρω can mean awaken or raise; ἐκ νεκρῶν makes resurrection its sense here. [High]"],["ἐκ νεκρῶν은 직역하면 ‘죽은 자들 가운데서’입니다. 통용 번역 ‘죽음에서’도 사건을 전달하지만 원문의 복수 명사와 분리의 이미지를 압축합니다. [높음]","Literally “from among the dead”; “from death” conveys the event but compresses the plural noun&#x27;s imagery. [High]"],["αὐτόν은 남성 단수 대격이며 앞의 Ἰησοῦ Χριστοῦ를 가리킵니다. 부정사나 다른 숨은 주어를 상정할 근거가 없습니다. [매우 높음]","αὐτόν is masculine singular accusative and refers back to Jesus Christ. [Very high]"],["부활은 바울을 위임한 예수가 현재 살아 계심을 드러냅니다. 십자가 중심의 편지와 충돌하지 않으며 2:20, 3:1, 6:14에서 십자가가 전개됩니다. [높음]","Resurrection identifies the living commissioner; Galatians later develops the cross (2:20; 3:1; 6:14). [High]"],["바울은 부활하신 분을 보았다고 말합니다(고전 9:1; 15:8). 따라서 그의 위임 주장은 단순히 과거 예수에 관한 전승을 배운 데 근거하지 않습니다. [높음]","Paul claims to have seen the risen Lord (1 Cor 9:1; 15:8); his commission exceeds receiving a report. [High]"],["고전 15:3–8은 부활의 증언에 베드로와 열두 사도, 야고보, 바울을 포함합니다. 그러나 모든 ‘사도’ 용례의 자격을 한 가지 경험으로만 환원해서는 안 됩니다(빌 2:25). [높음]","1 Cor 15:3–8 connects resurrection witness to foundational figures, but not every use of “apostle” has one identical criterion. [High]"],["첫 절은 위임하신 분의 살아 계심을, 뒤의 십자가 언급은 복음의 내용을 비춥니다. ‘먼저 언급됨’이 신학적 우선순위를 확정하지는 않습니다. [높음]","The opening highlights the living commissioner; later passages unfold the cross. Sequence alone does not establish doctrinal rank. [High]"],["1:1은 위임의 출처가 사람에게 있지 않음을, 1:10은 사람을 기쁘게 하는 것이 사역의 목적일 수 없음을 밝힙니다. 둘은 관련되지만 사람을 무시하라는 명령은 아닙니다. [높음]","1:1 concerns source; 1:10 concerns whom Paul seeks to please. Neither licenses contempt for people. [High]"],["1:1의 사도직과 1:11–12의 복음은 모두 사람을 궁극적 출처로 삼지 않습니다. 직분의 주장과 메시지의 주장이 서로 지지합니다. [높음]","His commission (1:1) and gospel (1:11–12) both claim nonhuman ultimate origin. [High]"],["1:15–16은 하나님이 바울을 부르시고 아들을 그에게 계시하셨다고 설명합니다. 이는 1:1의 압축된 위임 주장을 풀어 주지만 다메섹 사건의 모든 세부를 서술하지 않습니다. [높음]","God&#x27;s call and revelation of the Son in 1:15–16 expand the opening claim, without narrating every event detail. [High]"],["1:18–24는 초기 접촉의 범위를, 2:1–10은 나중의 교제를 서술합니다. 바울은 메시지가 예루살렘에서 파생되지 않았다고 하면서도 복음의 일치를 확인합니다. [높음]","Gal 1:18–2:10 distinguishes independent origin from subsequent fellowship and recognition. [High]"],["같지 않습니다. 바울은 게바와 야고보를 만났고(1:18–19), 기둥들에게 교제의 악수를 받았다고 말합니다(2:9). 기원의 독립성과 관계의 단절은 다릅니다. [확실]","No. Paul met Cephas and James (1:18–19) and received fellowship from the pillars (2:9). [High]"],["이 본문은 그리스도의 위임이 사도적 주장보다 앞선다는 질문을 제기합니다. 후대 교회 구조의 세부를 직접 규정하지 않으므로 가르침의 내용과 공동체의 분별을 함께 검토해야 합니다(1:8; 2:9). [중간]","Christ commissions Paul; the verse does not prescribe all later church structures. Test content and communal discernment (1:8; 2:9). [Moderate]"],["‘직접 받음’이라는 주장만으로 충분하지 않습니다. 갈 1:8–9의 복음 일치, 2:9의 교제, 삶의 열매(5:22–23)를 함께 점검하십시오. 이것은 바울의 고유한 사도직을 오늘의 모든 주장과 동일시하지 않는 적용입니다. [적용]","Test the claim against the gospel (1:8–9), fellowship (2:9), and fruit (5:22–23); a modern claim is not automatically Paul&#x27;s office. [Application]"],["‘사람들에게서/사람을 통해서’라는 이중 부정과 ‘그러나 예수 그리스도와 아버지를 통해서’라는 긍정이 중심입니다. ‘죽은 자들 가운데서 일으키신’은 아버지를 한정합니다. [확실]","Two human denials contrast with divine agency; the resurrection participle identifies the Father. [High]"],["바울의 사도직은 인간에게서 비롯되거나 인간이 전달한 것이 아니라 부활하신 예수 그리스도와 하나님 아버지를 통한 것이라고 그는 주장합니다. [확실]","Paul claims his apostleship came through the risen Christ and the Father, not from or through humans. [High]"],["본문은 바울의 위임을 살아 계신 그리스도께 연결합니다. 묵상할 때 내 소명 주장보다 먼저 그리스도의 말씀과 복음이 중심에 있는지 살펴보십시오. [묵상]","The text ties Paul&#x27;s commission to the living Christ. Reflect on whether Christ and his gospel lead your sense of calling. [Reflection]"],["예수는 바울이 논하는 과거의 주제이면서 현재 위임하시는 살아 계신 분입니다. 이 절만으로 모든 개인 경험의 방식을 정하지는 마십시오. [높음/묵상]","Jesus is the living commissioner, not only a historical subject; the verse does not prescribe every believer&#x27;s experience. [High/Reflection]"],["아버지께서 죽은 자들 가운데서 일으키신 분입니다. 본문은 부활을 명시하지만 ‘지금 내 안에 사심’은 2:20에서 더 분명히 말합니다. [확실]","The Father raised him from the dead; indwelling is stated more explicitly in 2:20. [High]"],["바울의 방향 전환은 1:13–16과 행 9장에서 보입니다. 자신의 변화가 꼭 같은 극적 형태일 필요는 없다는 점을 두고, 무엇이 삶의 방향을 바꾸는지 묵상하십시오. [묵상]","Paul&#x27;s reversal appears in Gal 1:13–16 and Acts 9. Reflect on direction of life without requiring an identical dramatic event. [Reflection]"],["이 절은 살아 계신 그리스도를 위임의 근원으로 말합니다. 읽은 말씀에 응답하거나 기도하는 중 그분의 가르침에 귀 기울이는 시간을 떠올려 보십시오; 특별한 감각을 정답으로 삼지 마십시오. [묵상]","The verse names the living commissioner. Consider prayerful response to his teaching without demanding a specific sensation. [Reflection]"],["부활의 언급은 실패가 끝이라는 생각에 질문을 던집니다. 현재의 어려움을 정직하게 이름 붙이고, 2:20의 그리스도와 연결해 무엇을 구할지 생각해 보십시오. [묵상]","Resurrection challenges finality of failure. Name your present difficulty and consider Gal 2:20 in prayer. [Reflection]"],["1:1 자체는 약함을 치료하는 방법을 명령하지 않습니다. 더 큰 결심만 반복하는지, 살아 계신 그리스도께 도움을 구하는지 차분히 살피십시오(2:20). [묵상]","This verse prescribes no technique for weakness; consider whether you rely only on resolve or seek the living Christ (2:20). [Reflection]"],["바울의 시작은 자기 개선의 성과가 아니라 하나님의 부르심(1:15–16)입니다. 노력과 은혜를 단순 대립시키기보다 지금 어떤 근원과 목적에서 행하는지 물어보십시오(5:6). [묵상]","Paul begins with God&#x27;s call (1:15–16). Examine the source and aim of action rather than treating effort and grace as a simple binary (5:6). [Reflection]"],["1:10은 사람을 기쁘게 하려는 압력을 직접 다룹니다. 오늘의 한 결정에서 칭찬에 대한 기대와 복음에 대한 충실함이 어떻게 작용하는지 살펴보십시오. [묵상]","Gal 1:10 addresses people pleasing. Examine one decision for the pull of approval and fidelity to the gospel. [Reflection]"],["1:1의 직접 위임과 2:9의 교제는 함께 존재합니다. ‘직접 받았다’는 말이 질문을 막고 타인을 침묵시키는지 점검하십시오. [묵상]","Direct commission (1:1) coexists with fellowship (2:9). Ask whether a claimed revelation silences scrutiny. [Reflection]"],["바울은 자신보다 위임하신 분을 앞세웁니다. 봉사에서 확신의 근거와 교정을 받아들이는 태도를 함께 성찰해 보십시오. [묵상]","Paul foregrounds the commissioner. Reflect on the basis of confidence and openness to correction in service. [Reflection]"],["본문이 직접 말하는 것은 부활하신 분의 위임입니다. 말과 결정에 적용할 때는 5:13–23의 사랑과 성령의 열매를 구체적인 기준으로 삼아 볼 수 있습니다. [묵상]","The verse states the risen Lord&#x27;s commission; Gal 5:13–23 offers concrete measures of love and fruit in speech and choices. [Reflection]"],["사람에게서 오지 않았다는 위임은 사람을 멸시하라는 뜻이 아닙니다. 한 관계에서 두려움 없이 진실을 말하면서도 사랑으로 섬기는 길을 생각하십시오(5:13). [묵상]","Nonhuman commission does not mean contempt. Consider truthful speech joined to service in love (5:13). [Reflection]"],["1:1은 바울보다 그를 위임하신 분에게 시선을 돌립니다. 나의 설명이 나의 탁월함을 강조하는지, 그리스도의 복음을 명료하게 하는지 돌아보십시오. [묵상]","The opening directs attention from Paul to Christ. Ask whether your words display yourself or clarify his gospel. [Reflection]"],["이 질문에 대한 타인의 반응을 정답처럼 강요할 수는 없습니다. 5:22–23의 사랑·온유·신실함이 실제 만남에서 드러났는지 스스로 살펴보십시오. [묵상]","Do not prescribe others&#x27; reactions. Review whether love, gentleness, and faithfulness were visible (5:22–23). [Reflection]"],["부활의 사실에서 모든 역경이 즉시 사라진다고 결론짓지 마십시오. 고난 속에서도 정직함, 소망, 타인을 향한 사랑이 나타나는지 생각해 보십시오(6:2). [묵상]","Resurrection does not promise instant relief. Consider honest hope and bearing another&#x27;s burdens (6:2). [Reflection]"],["1:1의 부활하신 위임자와 2:20의 ‘내 안에 사시는 그리스도’는 같은 살아 계신 그리스도를 가리킵니다. 전자는 사도직의 기원, 후자는 바울의 삶을 설명합니다. [높음]","The same living Christ commissions Paul (1:1) and lives in him (2:20), in distinct arguments. [High]"],["2:20은 그리스도께서 내 안에 사신다고 말하며 5:13은 사랑으로 섬기라고 권합니다. ‘내적 생명’이라는 말이 실제 행동을 지우지 않는지 살펴보십시오. [높음/묵상]","Gal 2:20 speaks of Christ living in Paul; 5:13 calls for loving service. Reflect on the link between life and action. [High/Reflection]"],["4:19는 그리스도께서 공동체 안에 형상을 이루시기를 바라는 바울의 수고입니다. 1:1의 살아 계신 그리스도와 연결되지만 개인의 특정 감정 상태를 보장하지는 않습니다. [높음]","Gal 4:19 seeks Christ&#x27;s formation among believers; it develops the living Christ motif without guaranteeing a particular feeling. [High]"],["사도권 논증의 중심에 아버지께서 일으키신 그리스도가 있습니다. 오늘 이 본문을 읽으며 바울의 주장과 그 주장 속 그리스도를 구분해 보고, 2:20의 기도로 응답해 볼 수 있습니다. [묵상]","At the center stands the Christ whom the Father raised. Consider Paul&#x27;s claim, then respond prayerfully with Gal 2:20. [Reflection]"]],"1:2":[["바울은 함께 있는 형제들을 발신 인사에 포함합니다. 이는 그가 고립된 개인으로 쓰지 않음을 보여 주지만, 각 형제가 모든 문장을 공동 집필했다는 뜻은 아닙니다. [높음]","Paul includes companions in the greeting; this shows fellowship, not necessarily joint authorship of each sentence. [High]"],["본문은 이름·수·소재지를 알려 주지 않습니다. 예루살렘의 특정 사도나 정해진 동역자 명단으로 확인하는 것은 불가능합니다. [확실]","No names, number, or location are given; precise identification is impossible. [High]"],["왜 이름을 생략했는지 바울은 설명하지 않습니다. 집단적 지지를 강조했을 수 있으나 필기 시간 절약이나 관례 등 다른 이유도 가능하므로 단정하지 않습니다. [불확실]","The reason for anonymity is unstated; collective support is plausible, not demonstrable. [Uncertain]"],["고전 1:1은 소스데네, 빌 1:1은 디모데를 명명합니다. 갈 1:2는 이름 대신 ‘함께 있는 모든 형제들’이라고 포괄합니다. [확실]","1 Cor 1:1 names Sosthenes and Phil 1:1 Timothy; Galatians uses a collective designation. [High]"],["σύν과 여격 ἐμοί는 ‘나와 함께’입니다. 동역과 교제를 떠올릴 수 있지만 전치사 자체가 공식 공동 저자나 모든 논점에 대한 동의를 증명하지 않습니다. [높음]","σύν plus dative means “with me”; deeper cooperation is possible but not encoded by the preposition alone. [High]"],["발신부에 포함된 만큼 편지와 관련한 연대는 시사됩니다. 그러나 개별 형제의 참여 정도나 모든 주장에 대한 동의는 알 수 없습니다. [중간]","Their inclusion suggests association with the letter; their exact contribution and agreement remain unknown. [Moderate]"],["사도직의 근원(1:1)과 형제들과의 관계(1:2)는 다른 문제입니다. 하나님께 위임받았다는 주장은 공동체와의 단절을 요구하지 않습니다. [높음]","Divine origin of office and human fellowship are compatible (1:1–2). [High]"],["πάντες는 ‘모든’을 뜻해 바울과 함께 있는 형제들을 포괄합니다. 문맥 밖의 모든 그리스도인이 동일한 장소에 있었다는 주장은 아닙니다. [높음]","πάντες includes all the brothers with Paul, not every Christian everywhere. [High]"],["ἀδελφοὶ는 여기서 신앙 공동체의 형제들입니다. ‘나와 함께 있는 모든’이라는 표현과 수신 교회 문맥이 혈연으로 국한하지 않음을 보입니다. 성별 포함 범위는 번역 관례와 문맥을 함께 고려합니다. [높음]","ἀδελφοὶ denotes fellow believers, not Paul&#x27;s biological brothers; inclusive rendering is a contextual translation judgment. [High]"],["친족어는 서로 다른 신분의 신자를 가족처럼 부르는 사회적 언어가 되었습니다. 실제로 언제나 평등하게 대우했다는 역사적 결론까지 단어 하나로 내릴 수는 없습니다. [높음]","Kinship language gave believers a shared family identity across status lines; the term alone does not prove equal practice. [High]"],["‘형제’의 관계는 3:26–28의 그리스도 안에서 하나 됨과 연결됩니다. 민족·사회적 차이를 지우기보다 율법 준수로 소속 자격을 가르는 문제를 다시 묻게 합니다. [높음]","The family term resonates with unity in Christ (3:26–28), challenging boundary making by law observance. [High]"],["ταῖς ἐκκλησίαις는 여격 복수이므로 둘 이상의 집회를 가리킵니다. 수신지는 한 도시의 단일 회중으로 한정되지 않습니다. [매우 높음]","The dative plural ταῖς ἐκκλησίαις addresses multiple assemblies. [Very high]"],["ἐκκλησία는 집회·모임을 뜻하며 시민 집회에도 쓰였습니다. 바울의 문맥에서는 그리스도를 믿는 공동체를 가리킵니다; 어원만으로 ‘세상에서 불러냄’이라는 정의를 확정할 수 없습니다. [높음]","ἐκκλησία means assembly; Paul refers to believing communities. Etymology alone cannot supply a full theology. [High]"],["한 넓은 지역에 복수의 교회가 있다는 분포를 보여 줍니다. 도시별 장로 수나 오늘의 교단 구조를 이 절만으로 입법할 수 없습니다. [높음]","The verse shows multiple assemblies across a region; it does not prescribe every later polity detail. [High]"],["고전 1:2의 한 도시 교회와 고전 16:1의 여러 갈라디아 교회를 비교할 수 있습니다. 단복수는 지시 대상의 범위에 따라 달라집니다. [높음]","A city assembly (1 Cor 1:2) and regional churches (1 Cor 16:1) differ in referential scope. [High]"],["Γαλατία는 민족적 북부 갈라디아 또는 로마의 더 넓은 속주를 가리킬 수 있습니다. 편지는 대상 도시를 열거하지 않습니다. [중간]","Γαλατία may mean the northern ethnic region or the broader Roman province; no cities are named. [Moderate]"],["북갈라디아설은 북부 민족 지역의 교회를, 남갈라디아설은 로마 속주 남부의 바울 방문 도시를 상정합니다. 둘 다 지리와 사도행전 자료를 조합한 학설입니다. [논쟁]","The northern view locates ethnic Galatians; the southern view locates cities in the Roman province. Both reconstruct geography from incomplete evidence. [Disputed]"],["남부설은 행 13–14의 방문과 연결해 이른 연대를 제안하기 쉽고, 북부설은 행 16:6; 18:23과 연결해 뒤의 방문을 상정합니다. 갈 2장과 행 15장의 동일시 여부도 논쟁이므로 단일 연대를 확정하지 않습니다. [논쟁]","Southern and northern proposals change Acts correlations and possible dates; the Gal 2/Acts 15 identification is also debated. [Disputed]"],["남부설이라면 비시디아 안디옥, 이고니온, 루스드라, 더베(행 13–14)가 후보입니다. 북부설의 도시들은 사도행전에 구체적으로 명명되지 않습니다. [조건부]","Under the southern view, Antioch, Iconium, Lystra, and Derbe are candidates (Acts 13–14); northern cities are unnamed. [Conditional]"],["1:3의 인사는 있지만 일반적인 감사 단락이 없이 1:6의 놀람과 책망으로 넘어갑니다. 이 차이는 편지의 긴박함을 뒷받침합니다. [높음]","After the greeting, Paul moves to astonishment (1:6) without a customary thanksgiving, signaling urgency. [High]"],["급박한 상황을 시사하지만 갈라디아 신자 전부가 이미 다른 복음을 채택했다고 단정할 수는 없습니다. 바울은 아직 그들을 설득하고 있습니다. [높음]","The omission suggests urgency but does not prove every recipient had defected. [High]"],["바울은 문제 있는 공동체를 여전히 ‘교회들’이라고 부릅니다. 그들의 상태를 승인한다는 뜻은 아니며 책망을 관계 안에서 행합니다. [높음]","Paul still addresses them as churches while sharply correcting them. [High]"],["이 절만으로 형제 됨의 원리를 완전히 설명하지 않지만, 3:26–28은 그리스도 예수 안에서 믿음으로 하나님의 자녀가 됨을 말합니다. [높음]","Gal 3:26–28 supplies the Christ centered explanation for their shared family identity. [High]"],["두 집단은 이 편지의 교제 안에서 연결되며, 더 넓게는 그리스도 안의 복음에 참여합니다(3:26–28). 지리적 거리를 지우는 특정 조직 구조는 본문에 없습니다. [높음]","The letter connects them; the gospel in Christ unites them (3:26–28), without specifying an organization. [High]"],["ἐκκλησίαις는 실제 모임들을 가리킵니다. 3:26–29에 비추어 그리스도가 그들의 정체성과 소속의 중심임을 볼 수 있지만 1:2 자체는 완전한 교회론이 아닙니다. [높음]","The assemblies are concrete groups whose identity in Christ is developed in 3:26–29. [High]"],["바울은 개인적 위임과 ‘함께 있는 형제들’을 같이 말합니다. 내 경험과 공동체의 격려가 어떻게 서로를 돕는지 묵상하십시오. [묵상]","Paul names both commission and companions. Reflect on personal faith alongside communal encouragement. [Reflection]"],["함께 있는 형제들을 언급한 사실을 보며, 혼자 결정하는 일과 함께 분별할 일을 구체적으로 구분해 보십시오. 이 절이 모든 결정 절차를 명령하지는 않습니다. [묵상]","Consider which decisions need shared discernment; the verse itself gives no universal procedure. [Reflection]"],["‘형제들’이라는 호칭을 3:26–28과 나란히 읽으십시오. 의견 차이 중에도 상대를 그리스도 안의 사람으로 대하는 길을 생각해 보십시오. [묵상]","Read “brothers” with 3:26–28 and reflect on treatment amid disagreement. [Reflection]"],["1:2의 포괄적 호칭과 5:13의 사랑으로 섬김을 연결해 보십시오. 의견이 다른 한 사람에게 보일 수 있는 존중을 구체적으로 생각하십시오. [묵상]","Link the inclusive greeting with service in love (5:13); imagine one concrete act of respect. [Reflection]"],["갈 2장에는 실제 논쟁과 대면이 있습니다. 참된 표현은 의견 차이를 숨기는 것만이 아니라 진실을 사랑 안에서 말하는 태도일 수 있습니다. [묵상]","Gal 2 includes real disagreement; consider truthful speech joined to love. [Reflection]"],["‘모든 형제들’은 엘리트 몇 명만을 언급하지 않습니다. 공동체에서 잘 드러나지 않는 사람의 목소리를 어떻게 들을지 묵상하십시오; 본문은 특정 운영 방식을 요구하지 않습니다. [묵상]","“All the brothers” invites attention to less visible members, without prescribing a governing model. [Reflection]"],["1:2는 인물 숭배를 직접 논하지 않습니다. 다만 발신자와 형제들과 수신 교회들이 공유하는 복음(1:6–9)이 무엇인지 살피게 합니다. [묵상]","The verse does not explicitly critique celebrity; reflect on the gospel shared by sender, companions, and recipients. [Reflection]"],["대립하지 않습니다. 1:1은 위임의 근원, 1:2는 동행하는 관계를 다룹니다. 2:9의 교제까지 함께 읽으면 독립성과 교통을 동시에 볼 수 있습니다. [높음]","They are compatible: source of commission (1:1), companions (1:2), and fellowship (2:9). [High]"],["어느 쪽이 자신의 실제 습관인지 한 사례를 들어 살피십시오. 1:1–2는 인간 승인에 종속되지 않는 소명과 타인과 함께함을 동시에 보여 줍니다. [묵상]","Reflect on one real example of overdependence or isolation in light of 1:1–2. [Reflection]"],["바울의 서두는 개인적 충실함과 형제들과의 관계를 함께 보여 줍니다. 오늘 함께 듣고 분별할 사람을 떠올리되, 이 절을 획일적 교회 실행의 명령으로 만들지 마십시오. [묵상]","Paul&#x27;s opening joins personal fidelity and fellowship. Consider someone with whom to discern, without turning it into a rigid rule. [Reflection]"]],"1:3":[["χάρις와 εἰρήνη, 곧 은혜와 평안입니다. 문장은 둘의 근원을 하나님 아버지와 주 예수 그리스도께 둡니다. [확실]","Grace and peace come from God the Father and the Lord Jesus Christ. [High]"],["순서는 바울의 반복적 인사말과 일치합니다(롬 1:7; 고전 1:3). 은혜가 평안의 신학적 근거라는 읽기는 가능하지만, 어순만으로 엄격한 시간 순서를 증명하지는 않습니다. [높음/추론]","This is Paul&#x27;s regular sequence; grace may ground peace, but word order alone cannot prove a strict sequence. [High/Inference]"],["고대 편지의 인사를 복음의 언어로 채웁니다. 뒤의 1:6과 2:21에서 은혜가 실제 논쟁의 핵심이 되는 점을 함께 읽으십시오. [높음]","Paul fills the greeting with gospel language; grace becomes central in 1:6 and 2:21. [High]"],["1:1은 위임의 행위자와 부활을, 1:3은 수신자에게 오는 은혜와 평안의 근원을 말합니다. 어순 차이에 독립적인 위계 교리를 세울 근거는 없습니다. [높음]","The two verses have different rhetorical functions; their reversed order does not establish a hierarchy. [High]"],["χάρις는 호의, 은총, 선물, 감사의 뜻을 가질 수 있습니다. 이 인사에서는 하나님과 그리스도에게서 오는 은혜이며 정확한 범위는 편지 전체가 채웁니다. [높음]","χάρις can denote favor, gift, or thanks; here it is grace from God and Christ, developed through the letter. [High]"],["일반 헬라어 편지의 χαίρειν(‘안녕’)과 소리가 비슷하지만 같은 단어는 아닙니다. 바울의 χάρις를 단순한 말장난으로 축소해서는 안 됩니다. [높음]","χάρις echoes but differs from the conventional χαίρειν greeting; Paul&#x27;s term has theological weight. [High]"],["갈 2:21은 은혜를 폐하지 않는다고 하고 5:4는 은혜에서 떨어짐을 경고합니다. 2:20과 5:6을 함께 보면 은혜가 단순한 감정 이상의 삶과 관계된다고 해석할 수 있습니다. [높음/종합]","Gal 2:21 and 5:4 make grace decisive; 2:20 and 5:6 suggest implications for life, beyond mere sentiment. [High/Synthesis]"],["1:6은 은혜 안의 부르심, 2:21은 은혜를 폐하지 않음, 5:4는 은혜에서 떨어짐, 6:18은 마지막 축복입니다. 이 흐름이 인사말의 무게를 밝힙니다. [확실]","Grace recurs at 1:6; 2:21; 5:4; and 6:18, framing the argument. [High]"],["‘자격 없는 자에게 베푸는 호의’는 유익한 요약이지만 그리스도와의 관계, 의롭다 함, 성령의 삶이라는 갈라디아서의 전개를 모두 담지는 못합니다. 정의를 본문으로 계속 보충하십시오. [높음]","“Undeserved favor” helps, but does not exhaust justification, Christ, and Spirit life in Galatians. [High]"],["εἰρήνη는 평화·화목·안녕을 가리킬 수 있습니다. 이 인사에서는 개인 감정만으로 제한할 근거가 없고 공동체의 관계도 고려해야 합니다(5:15, 22). [높음]","εἰρήνη can include peace, reconciliation, and welfare, beyond a private feeling (5:15, 22). [High]"],["칠십인역에서 εἰρήνη는 흔히 히브리어 שָׁלוֹם의 번역어입니다. 두 말의 의미 범위가 완전히 일치한다는 주장은 피하되 성경의 평화 전통을 떠올릴 수 있습니다. [높음]","The LXX often renders שָׁלוֹם with εἰρήνη; their semantic ranges overlap but are not identical. [High]"],["καί가 두 축복을 연결합니다. 은혜가 평안을 낳는다는 신학적 연결은 문맥상 자연스럽지만 이 한 어구는 인과 순서를 명시하지 않습니다. [높음/추론]","καί joins them; a causal link is plausible but not explicitly marked here. [High/Inference]"],["5:15의 서로 물어뜯음과 5:22의 성령의 열매인 평안을 비교하십시오. 1:3의 인사가 공동체에 실제로 필요한 것임을 볼 수 있지만 동일 단어만으로 모든 논증이 완성되지는 않습니다. [높음]","Compare community conflict (5:15) and the Spirit&#x27;s peace (5:22); the greeting anticipates a real need. [High]"],["ὑμῖν은 2인칭 복수 여격입니다. 여러 교회에 보내는 축복이며 각 개인도 그 수신 공동체 안에 포함됩니다. [매우 높음]","ὑμῖν is second person plural dative, addressing the recipients collectively. [Very high]"],["복수 ὑμῖν과 복수 ‘교회들’(1:2)은 공동체 차원을 분명히 합니다. 각 신자의 경험을 배제한다는 뜻은 아닙니다. [높음]","The plural recipient and churches show a corporate dimension, without excluding individual believers. [High]"],["ἀπό와 속격은 은혜와 평안의 출처를 나타냅니다. 1:1에서는 인간 출처를 부정했고, 여기서는 하나님과 그리스도를 출처로 긍정합니다. [높음]","ἀπό with genitive marks source; compare the denied human source in 1:1. [High]"],["본문은 ‘하나님 우리 아버지’와 ‘주 예수 그리스도’를 나란히 명시합니다. 바울 자신이나 수신자의 공로가 출처라고 말하지 않습니다. [확실]","The stated source is God our Father and the Lord Jesus Christ. [High]"],["ἀπό 하나가 이어지는 두 속격 구문을 지배하는 것이 자연스럽습니다. 두 표현을 같은 인물의 두 이름으로 혼동하지 마십시오. [높음]","One ἀπό naturally governs both coordinated genitives, referring to distinct persons. [High]"],["예수가 아버지와 함께 은혜와 평안의 출처에 놓인 것은 그의 높은 지위를 보여 줍니다. 이는 강한 그리스도론적 자료이지만 이 문장만으로 후대의 모든 교리 공식이 직접 진술된 것은 아닙니다. [높음]","Christ shares the source phrase with the Father, a significant Christological datum, not a complete later creed. [High]"],["공동 출처라는 문법은 중요합니다. 하지만 ‘한 ἀπό’에서 동일 인격, 동일한 역할의 모든 측면, 삼위일체 공식 전체를 곧바로 연역할 수 없습니다. [높음]","The shared ἀπό matters; it does not by itself establish identity of persons or every aspect of Trinitarian doctrine. [High]"],["‘우리’는 바울과 수신자의 관계를 아버지 앞에 묶습니다. 3:26과 4:6은 아들 됨을 더 풀어 줍니다. [높음]","“Our” joins sender and recipients before the Father; sonship is developed in 3:26 and 4:6. [High]"],["문맥상 바울, 함께 있는 형제들, 편지의 갈라디아 신자들을 포함합니다. 모든 사람에게 이미 동일한 신분이 주어졌다고 이 대명사만으로 단정하지 않습니다. [높음]","It includes Paul, his companions, and Galatian believers in the address; universal inclusion is not established by this pronoun. [High]"],["3:26의 믿음으로 하나님의 아들 됨, 4:4–7의 양자됨과 ‘아바 아버지’를 따라 읽으십시오. 1:3의 관계적 호칭이 편지에서 더 풍성해집니다. [높음]","Read “our Father” alongside sonship (3:26) and adoption and “Abba” (4:4–7). [High]"],["κύριος는 일반적으로 주인·권한을 가진 사람을 가리킬 수 있습니다. 예수에게 붙인 뜻은 초기 기독교 신앙과 문맥에서 판단해야 합니다. [높음]","κύριος can mean master or lord; its force for Jesus is contextual. [High]"],["칠십인역은 히브리어 하나님의 이름 יהוה를 흔히 κύριος로 표기합니다. 그러나 모든 κύριος 용례가 자동으로 그 이름을 직접 인용하는 것은 아닙니다. [높음]","The LXX frequently uses κύριος for יהוה; not every occurrence is a direct name citation. [High]"],["‘주 예수 그리스도’는 높임받은 예수의 권위를 나타냅니다. LXX 전통과 1:1의 공동 행위자를 고려하면 신학적으로 중요하지만 칭호 하나만으로 해석을 끝내지 마십시오. [높음]","The title signals Jesus&#x27; authority; its LXX background and shared agency matter, though the title alone is not a complete argument. [High]"],["‘예수’는 역사적 인물의 이름, ‘그리스도’는 메시아 칭호, ‘주’는 권위의 칭호입니다. 각 단어가 그 모든 내용을 매번 독립적으로 설명하는 것은 아니지만 함께 한 분을 가리킵니다. [높음]","Jesus is the personal name, Christ the Messiah title, and Lord the authority title; together they identify one person. [High]"],["창 3장의 관계 파괴부터 예언서의 회복 소망, 그리스도 안의 화목까지 큰 흐름을 그릴 수 있습니다. 다만 1:3 자체가 창세기를 직접 인용하지는 않습니다. [성경신학적 연결]","One may trace rupture (Gen 3) and promised restoration to Christ; Gal 1:3 does not directly quote Genesis. [Canonical connection]"],["민 6:24–26과 갈 1:3은 하나님에게서 오는 복을 백성에게 빕니다. 민수기는 여호와의 얼굴과 평강을, 갈라디아서는 아버지와 그리스도에게서 오는 은혜와 평안을 말합니다. 직접 인용은 아닙니다. [높음]","Both pronounce divine blessing; Numbers invokes the LORD&#x27;s face and peace, Galatians names Father and Christ. Not a quotation. [High]"],["사 9:6–7, 52:7 같은 평화 약속과 연결해 읽을 수 있습니다. 그러나 1:3은 특정 예언의 성취 구절을 명시적으로 지목하지 않습니다. [가능한 연결]","Isa 9:6–7 and 52:7 offer a peace horizon; Gal 1:3 names no specific prophecy as fulfilled. [Possible]"],["요 14:27의 ‘나의 평안’을 비교하면 평안이 단지 환경의 평온은 아님을 생각할 수 있습니다. 요한복음과 갈라디아서의 문맥 차이도 유지하십시오. [성경 간 연결]","John 14:27 offers a comparison for Christ&#x27;s peace, while its setting differs from Galatians. [Canonical connection]"],["롬 5:1–2는 믿음으로 의롭다 함을 얻은 자의 하나님과의 평화와 은혜에 서 있음을 연결합니다. 갈 1:3은 이 논증을 압축해 증명하는 문장이 아니라 인사입니다. [높음]","Rom 5:1–2 links peace with God and access to grace; Gal 1:3 is a greeting, not the full argument. [High]"],["엡 2:14는 그리스도 자신이 ‘우리의 평안’이라고 말하고 유대인과 이방인의 화해를 전개합니다. 갈 1:3은 그리스도를 평안의 출처로 명시합니다; 두 표현은 관련되지만 동일 문구는 아닙니다. [높음]","Eph 2:14 calls Christ our peace in a reconciliation argument; Gal 1:3 names him as peace&#x27;s source. [High]"],["1:6은 그들이 ‘그리스도의 은혜 안에서’ 부르신 분을 떠나고 있음을 책망합니다. 따라서 1:3의 은혜는 형식적인 장식어로 남지 않습니다. [높음]","Gal 1:6 makes grace central to the warning; the greeting is no empty ornament. [High]"],["2:21은 의가 율법을 통해 온다면 그리스도의 죽음이 헛되다고 논증합니다. 은혜는 1:3의 축복이자 복음의 핵심 원리입니다. [높음]","Gal 2:21 opposes nullifying grace by seeking righteousness through law. [High]"],["5:4는 율법으로 의롭다 함을 얻으려는 태도를 ‘은혜에서 떨어짐’이라고 합니다. 은혜와 모든 순종이 대립한다는 뜻이 아니라 의롭다 함의 근거를 율법에 두지 말라는 논증입니다. [높음]","Gal 5:4 targets law as the basis of justification, not all obedience. [High]"],["5:22의 εἰρήνη는 성령의 열매입니다. 1:3의 평안을 공동체 삶에서 경험할 수 있음을 비추지만 축복의 선언과 열매 목록은 문맥상 다른 발화입니다. [높음]","Peace appears as the Spirit&#x27;s fruit (5:22); it illuminates lived implications of the greeting without collapsing contexts. [High]"],["ἀπὸ θεοῦ ... καὶ κυρίου Ἰησοῦ Χριστοῦ는 평안과 은혜를 그리스도에게서 오는 것으로도 명시합니다. 묵상에서 선물뿐 아니라 그분과의 관계를 살펴볼 수 있습니다. [높음/묵상]","The source phrase includes Christ; reflect on relationship with him as well as the gifts. [High/Reflection]"],["본문은 그리스도를 단지 전달 통로라고 하지 않고 공동 출처의 자리에 둡니다. 그 사실이 기도와 신뢰에 어떤 의미인지 살피되 정해진 감정을 요구하지 마십시오. [묵상]","Christ stands in the shared source phrase; consider its bearing on trust without demanding a particular feeling. [Reflection]"],["세 칭호의 의미를 구별해 본 뒤, 지금 자신의 이해에서 어느 면을 놓치고 있는지 물어보십시오. 본문은 특정 체험을 정답으로 정하지 않습니다. [묵상]","Consider the personal name and the Messiah and Lord titles; the verse prescribes no single experience. [Reflection]"],["은혜의 근원이 아버지와 그리스도라는 문장으로 돌아오십시오. 구체적인 한 상황에서 도움을 요청하고 받은 선물에 감사하는 방식으로 묵상할 수 있습니다. [묵상]","Return to the named source of grace; reflect through a concrete request and gratitude. [Reflection]"],["평안의 결핍을 부정할 필요는 없습니다. 그 상황을 이름 붙여 하나님께 아뢰고, 필요한 관계 회복이나 실제 조치도 함께 생각하십시오(5:15, 22). [묵상]","Name the distress, turn to God, and consider relational or practical steps (5:15, 22). [Reflection]"],["갈 5:4는 의롭다 함의 근거를 율법적 수행에 두는 위험을 말합니다. 자신의 노력이 무엇을 얻으려는지, 믿음이 무엇을 신뢰하는지 구분해 보십시오. [묵상]","Gal 5:4 challenges law as the basis of justification; examine what your striving seeks and trusts. [Reflection]"],["정보로 아는 것과 관계 안에서 응답하는 것은 구별될 수 있습니다. 오늘 1:3을 읽고 아버지와 그리스도께 드릴 한 문장의 기도나 감사가 무엇인지 생각하십시오. [묵상]","Distinguish information from response; consider a brief prayer or thanks prompted by 1:3. [Reflection]"],["갈 5:6은 ‘사랑으로 역사하는 믿음’을 말합니다. 은혜를 수동성으로 정의하기보다 누구를 신뢰하며 어떻게 사랑으로 행동하는지 살펴보십시오. [묵상]","Gal 5:6 describes faith working through love; consider trust expressed in action. [Reflection]"],["1:3은 평안의 출처를, 5:22는 평안이 성령의 열매임을 말합니다. 압박 때의 반응을 정죄의 점수표로 삼지 말고 다음 대화에서 취할 한 가지 평화로운 행동을 생각하십시오. [묵상]","The greeting names peace&#x27;s source and 5:22 its fruit; consider one peaceful action under pressure. [Reflection]"],["‘우리 아버지’를 4:6–7과 함께 읽으십시오. 두려움을 숨기지 않으면서도 아버지께 말할 수 있는 한 가지 실제 문제를 떠올려 보십시오. [묵상]","Read “our Father” with 4:6–7 and bring one real fear to him. [Reflection]"],["은혜는 공동체를 향한 복수 인사입니다(ὑμῖν). 의견이 다른 한 사람을 존중하고 도울 구체적인 말을 생각해 보십시오(5:13). [묵상]","The greeting addresses a community; consider a respectful, helpful word to another (5:13). [Reflection]"],["평안을 단순한 갈등 회피와 동일시하지 마십시오. 5:13–15를 읽고 진실을 말하면서도 서로를 해치지 않는 태도를 생각해 보십시오. [묵상]","Peace need not mean avoiding conflict; read 5:13–15 and consider truthful, nonharmful speech. [Reflection]"],["타인이 무엇을 ‘맛보았는지’ 강요하여 평가할 수는 없습니다. 자신의 대화가 은혜의 출처를 가리키고 평안을 도왔는지 겸손히 돌아보십시오. [묵상]","You cannot dictate others&#x27; impressions; reflect humbly on whether your words served grace and peace. [Reflection]"],["고대 인사 형식을 사용하지만 은혜는 1:6, 2:21, 5:4에서 논증의 중심이 됩니다. 그래서 복음과 삶의 주제를 예고하는 인사로 읽는 것이 타당합니다. [높음]","It is a real greeting that anticipates the letter&#x27;s central grace argument (1:6; 2:21; 5:4). [High]"],["본문의 결말은 두 단어 자체보다 그 출처인 아버지와 주 예수 그리스도입니다. 오늘의 묵상은 더 많이 안다는 평가 대신 그분께 드릴 정직한 응답으로 마칠 수 있습니다. [묵상]","The sentence directs attention to Father and Lord Jesus Christ; end reflection with an honest response rather than a required score. [Reflection]"]]};
Object.keys(fullQuestions).forEach(v=>{data[v].qs=fullQuestions[v].map((q,i)=>[q[0],q[1],q[2],...fullAnswers[v][i]]);});
const scriptureText={"Gal 1:1":"Paul, an apostle—not from human beings, nor through a human being, but through Jesus Christ and God the Father, who raised him from the dead—","Gal 1:2":"and all the brothers and sisters with me, to the churches of Galatia:","Gal 1:3":"Grace to you and peace from God our Father and the Lord Jesus Christ.","Gal 1:6":"I am astonished that you are turning away so quickly from the one who called you in the grace of Christ, toward a different gospel—","Gal 1:7":"not that there is another. Rather, some are troubling you and want to distort the gospel of Christ.","Gal 1:8":"But even if we, or an angel from heaven, should proclaim to you a gospel contrary to what we proclaimed to you, let that one be under a curse.","Gal 1:9":"As we have said before, so now I say again: If anyone proclaims to you a gospel contrary to what you received, let that one be under a curse.","Gal 1:10":"Am I now seeking the approval of people, or of God? Am I trying to please people? If I were still pleasing people, I would not be Christ's servant.","Gal 1:11":"For I want you to know, brothers and sisters, that the gospel I proclaimed is not of human origin.","Gal 1:12":"For I did not receive it from a human being, nor was I taught it; I received it through a revelation of Jesus Christ.","Gal 1:13":"You have heard of my former way of life in Judaism: I persecuted the church of God beyond measure and tried to destroy it.","Gal 1:14":"I was advancing in Judaism beyond many of my contemporaries among my people, being far more zealous for the traditions of my ancestors.","Gal 1:15":"But when the one who set me apart from my mother's womb and called me through his grace was pleased","Gal 1:16":"to reveal his Son in me, so that I might proclaim him among the nations, I did not immediately consult with flesh and blood.","Gal 1:17":"Nor did I go up to Jerusalem to those who were apostles before me. Instead I went away into Arabia and returned again to Damascus.","Gal 1:18":"Then, after three years, I went up to Jerusalem to visit Cephas, and I stayed with him fifteen days.","Gal 1:19":"But I saw none of the other apostles, except James, the Lord's brother.","Gal 1:20":"What I am writing to you—before God, I am not lying.","Gal 1:21":"Then I went into the regions of Syria and Cilicia.","Gal 1:22":"I was still unknown by sight to the churches of Judea that are in Christ.","Gal 1:23":"They only kept hearing, “The one who once persecuted us is now proclaiming the faith he once tried to destroy.”","Gal 1:24":"And they glorified God because of me.","Gal 2:1":"Then, after fourteen years, I went up again to Jerusalem with Barnabas, taking Titus along as well.","Gal 2:2":"I went up in response to a revelation and laid before them the gospel I proclaim among the nations; I did so privately before those held in esteem, lest somehow I should be running, or had run, in vain.","Gal 2:3":"Yet not even Titus, who was with me, was compelled to be circumcised, though he was Greek.","Gal 2:4":"This matter arose because of false brothers who had slipped in to spy on the freedom we have in Christ Jesus, so that they might enslave us.","Gal 2:5":"We did not yield to them in submission, not even for a moment, so that the truth of the gospel might remain with you.","Gal 2:6":"As for those who were regarded as important—whatever they once were makes no difference to me; God shows no partiality—they added nothing to my message.","Gal 2:7":"On the contrary, they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been entrusted with it for the circumcised.","Gal 2:8":"For the one who worked through Peter for an apostleship to the circumcised worked through me also for the nations.","Gal 2:9":"And when James and Cephas and John, who were regarded as pillars, recognized the grace given to me, they gave Barnabas and me the right hand of fellowship: we were to go to the nations, and they to the circumcised.","Gal 2:10":"They asked only that we remember the poor—the very thing I was eager to do.","Gal 2:20":"And I live—yet no longer I, but Christ lives in me. The life I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.","Gal 2:21":"I do not set aside the grace of God. For if righteousness comes through the law, then Christ died for nothing.","Gal 3:1":"O foolish Galatians, who has bewitched you? Before your eyes Jesus Christ was publicly portrayed as crucified.","Gal 3:26":"For in Christ Jesus you are all children of God through faith.","Gal 3:27":"For all of you who were baptized into Christ have clothed yourselves with Christ.","Gal 3:28":"There is neither Jew nor Greek, neither slave nor free, nor is there male and female; for you are all one in Christ Jesus.","Gal 4:4":"But when the fullness of time came, God sent forth his Son, born of a woman, born under the law,","Gal 4:5":"to redeem those under the law, so that we might receive adoption as children.","Gal 4:6":"And because you are children, God sent the Spirit of his Son into our hearts, crying, “Abba, Father!”","Gal 4:7":"So you are no longer a slave but a child; and if a child, then an heir through God.","Gal 4:19":"My children, for whom I am again in labor until Christ is formed in you—","Gal 5:4":"You who seek to be justified by the law have been severed from Christ; you have fallen away from grace.","Gal 5:6":"For in Christ Jesus neither circumcision nor uncircumcision has any power, but faith working through love does.","Gal 5:13":"For you were called to freedom, brothers and sisters. Only do not turn your freedom into an opportunity for the flesh; instead, through love serve one another.","Gal 5:14":"For the whole law is fulfilled in one word: “You shall love your neighbor as yourself.”","Gal 5:15":"But if you bite and devour one another, watch out that you are not consumed by one another.","Gal 5:16":"But I say, walk by the Spirit, and you will certainly not carry out the desire of the flesh.","Gal 5:17":"For the flesh desires what is opposed to the Spirit, and the Spirit what is opposed to the flesh. These are set against each other, so that you do not simply do whatever you wish.","Gal 5:18":"But if you are led by the Spirit, you are not under the law.","Gal 5:19":"The works of the flesh are evident: sexual immorality, impurity, and unrestrained conduct;","Gal 5:20":"idolatry, sorcery, hostilities, strife, jealousy, outbursts of anger, selfish rivalries, divisions, factions,","Gal 5:21":"envy, drunkenness, carousing, and things like these. I warn you, as I warned you before, that those who practice such things will not inherit the kingdom of God.","Gal 5:22":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness,","Gal 5:23":"gentleness, self-control. Against such things there is no law.","Gal 6:2":"Bear one another's burdens, and in this way you will fulfill the law of Christ.","Gal 6:14":"But may I never boast except in the cross of our Lord Jesus Christ, through whom the world has been crucified to me, and I to the world.","Acts 14:14":"When the apostles Barnabas and Paul heard this, they tore their garments and rushed into the crowd, crying out.","1 Cor 1:2":"To the church of God in Corinth, those made holy in Christ Jesus and called to be saints, together with all in every place who call on the name of our Lord Jesus Christ, their Lord and ours:","1 Cor 1:3":"Grace to you and peace from God our Father and the Lord Jesus Christ.","1 Cor 9:1":"Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?","1 Cor 15:8":"Last of all, as to one born at an unexpected time, he appeared also to me.","1 Cor 16:1":"Now concerning the collection for the holy ones: as I directed the churches of Galatia, so you also should do.","Phil 2:25":"I considered it necessary to send you Epaphroditus—my brother, fellow worker, and fellow soldier, and your messenger and minister to my const bookNames={Gal:'Gal',갈:'Gal',Acts:'Acts',행:'Acts','1 Cor':'1 Cor',고전:'1 Cor',Phil:'Phil',빌:'Phil',Rom:'Rom',롬:'Rom'};
function resolveRefs(raw){let book='Gal',chapter=null,result=[];for(let part of raw.split(/[;,]/)){part=part.trim();let bm=part.match(/^(Gal|갈|Acts|행|1 Cor|고전|Phil|빌|Rom|롬)\s+/);if(bm){book=bookNames[bm[1]];part=part.slice(bm[0].length)}let m=part.match(/^(\d+):(\d+)(?:[–-](?:(\d+):)?(\d+))?$/);let start,end,endChapter;if(m){chapter=+m[1];start=+m[2];endChapter=m[3]?+m[3]:chapter;end=m[4]?+m[4]:start}else{m=part.match(/^(\d+)(?:[–-](\d+))?$/);if(!m||!chapter)return [];start=+m[1];end=+(m[2]||m[1]);endChapter=chapter}if(endChapter<chapter||endChapter-chapter>2||end>30)return [];for(let c=chapter;c<=endChapter;c++){let first=c===chapter?start:1,last=c===endChapter?end:Math.max(...Object.keys(scriptureText).filter(k=>k.startsWith(`${book} ${c}:`)).map(k=>+k.split(':')[1]));for(let v=first;v<=last;v++){let key=`${book} ${c}:${v}`;if(!scriptureText[key])return [];result.push(key)}}chapter=endChapter}return [...new Set(result)];}
function linkRefs(s){return s.replace(/\(([^()]*\d+:\d+[^()]*)\)/g,(whole,raw)=>{const refs=resolveRefs(raw);return refs.length?`<button type="button" class="ref-link" data-refs="${escapeHtml(refs.join('|'))}" aria-label="Read ${escapeHtml(raw)}">(${raw})</button>`:whole});}
let refTrigger=null;
function closeRef(){refBackdrop.hidden=true;if(refTrigger)refTrigger.focus();refTrigger=null;}
function openRef(button){const ids=button.dataset.refs.split('|');refTrigger=button;hideWordPopup();refHeading.textContent=button.textContent;refScroll.innerHTML=ids.map(id=>`<p class="ref-verse"><b>${escapeHtml(id)}</b>${escapeHtml(scriptureText[id])}</p>`).join('');refBackdrop.hidden=false;refScroll.scrollTop=0;refClose.focus();}
questions.addEventListener('click',e=>{let b=e.target.closest('.ref-link');if(b)openRef(b);});
refClose.onclick=closeRef;
refBackdrop.addEventListener('click',e=>{if(e.target===refBackdrop)closeRef();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!refBackdrop.hidden)closeRef();});
let current='1:1',filter='All'; const cats=['All','Observation','Greek & Grammar','History','Context','Comparison','Theology','Ecclesiology','Whole Bible','Seeing Christ','Enjoying Christ','Living Christ','Expressing Christ'];
function render(){tabs.innerHTML=Object.keys(data).map(v=>`<button class="${v===current?'active':''}" onclick="hideWordPopup();current='${v}';render()">Gal ${v}</button>`).join('');filters.innerHTML=cats.map(c=>`<button class="${c===filter?'active':''}" onclick="filter='${c}';render()">${c}</button>`).join('');let d=data[current],vd=verseDisplay[current];verse.innerHTML=`<div class="verse"><div class="note">UBS5 GREEK · <span class="verb">VERBS</span> · <span class="noun">NOUNS</span></div>${wordLine(vd)}<div class="note" style="margin-top:14px">WORKING DIRECT ENGLISH</div><div class="eng">${d.e}</div></div>`;let qs=d.qs.map((q,i)=>[q,i]).filter(x=>filter==='All'||x[0][0]===filter);questions.innerHTML=qs.map(([q,i])=>`<div class="q"><button onclick="this.parentElement.classList.toggle('open')"><div class="meta">${q[0]}</div><div class="ko">Q${i+1}. ${q[1]}</div><div class="en">${q[2]}</div><div class="tap">Tap question to reveal answer · 질문을 터치하면 답 보기</div></button><div class="body"><div class="answer"><div class="label">A${i+1} · Answer & Commentary</div><div class="ako">${q[3]}</div><div class="aen">${linkRefs(q[4])}</div></div></div></div>`).join('')}
render();</script></body></html>
